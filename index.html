function formatBuy(r){
  if(r.packages_to_buy && r.package_size && r.package_unit){
    if(r.packages_to_buy===1){
      if(['Stück','Knolle','Tube','Bund','Packung'].includes(r.package_unit)) return '1 '+r.package_unit;
      return Number(r.package_size).toLocaleString('de-DE')+' '+r.package_unit;
    }
    return r.packages_to_buy+' × '+Number(r.package_size).toLocaleString('de-DE')+' '+r.package_unit;
  }
  if(r.quantity_to_buy!=null && r.required_unit) return Number(r.quantity_to_buy).toLocaleString('de-DE')+' '+r.required_unit;
  return 'prüfen';
}
function reason(r){
  const inv=Number(r.covered_by_inventory||0), del=Number(r.covered_by_delivery||0);
  if(r.category==='Vorrat prüfen') return 'Bestand noch nicht sicher bestätigt';
  if(inv>0 && del>0) return 'Vorrat + Lieferung berücksichtigt';
  if(inv>0) return 'Vorrat bereits abgezogen';
  if(del>0) return 'Biokiste rechtzeitig berücksichtigt';
  return 'Für den Plan noch erforderlich';
}

function confirmCookStart(key){

  const n=Number(document.getElementById('cookServingsInput')?.value||c.defaultYield||1);
  if(!Number.isFinite(n)||n<=0){alert('Bitte eine gültige Portionszahl eingeben.');return;}

async function finishCook(){
  const title=tm6Cook[cookMode].title;
  const {data:recipe}=await sb.from('recipes').select('id,title').eq('household_id',householdId).eq('title',title).maybeSingle();
  if(!recipe){alert('Rezept konnte nicht mit dem Vorrat verknüpft werden.');return;}
  let excluded=[];
  if(title==='Blumenkohlsuppe'){
    const {data:p}=await sb.from('foods').select('id').eq('name','Pastinake').maybeSingle();
    if(p?.id) excluded=[p.id];
  }
  let y=prompt('Wie viele Teller/Portionen hat die Kochrunde tatsächlich ergeben?',cookServings??tm6Cook[cookMode].defaultYield??'');
  if(y===null)return;
  let p=prompt('Wie viele Portionen bleiben nach dem geplanten Essen übrig? Diese werden als fertige Mahlzeit gespeichert.','');
  if(p===null)return;
  const {data,error}=await sb.rpc('consume_recipe_v2',{
    p_recipe_id:recipe.id,p_cook_token:cookToken,p_multiplier:cookMultiplier,
    p_yield_portions:y.trim()===''?null:Number(y.replace(',','.')),
    p_portions_remaining:p.trim()===''?null:Number(p.replace(',','.')),
    p_excluded_food_ids:excluded
  });
  if(error){alert('Vorrat konnte nicht abgebucht werden: '+error.message);return;}
  if(data?.duplicate){
    alert('Diese Kochrunde wurde bereits verbucht ✓\n\nEs wurde nichts ein zweites Mal vom Vorrat abgezogen.');
    return;
  }
  const est=data?.tracked_estimated||[];
  const untracked=data?.tracked_unquantified||[];
  if(est.length || untracked.length){
    const bits=[];
    if(est.length) bits.push(`${est.length} geschätzte Vorräte wurden als Verbrauch protokolliert`);
    if(untracked.length) bits.push(`${untracked.length} noch nicht angelegte Vorräte wurden als Verbrauch erfasst`);
    alert(`Gekocht ✓\n\n${bits.join('. ')}.\n\nEs wurde keine falsche Restmenge erfunden.`);
  } else {
    alert('Gekocht ✓ Zutaten wurden mengenmäßig aus dem Vorrat abgebucht.');
  }
  const finishedKey=cookMode; cookMode=null;cookToken=null;cookServings=null;cookMultiplier=1;recipeOpen=finishedKey;activeTab='recipes';renderRecipes();
}


function niceAmount(n){
  if(!Number.isFinite(n)) return '';
  const rounded=Math.round(n*100)/100;
  const whole=Math.floor(rounded);
  const frac=Math.round((rounded-whole)*100)/100;
  const fractions=[
    [0.25,'¼'],[0.33,'⅓'],[0.5,'½'],[0.67,'⅔'],[0.75,'¾']
  ];
  const hit=fractions.find(([v])=>Math.abs(frac-v)<0.02);
  if(hit){
    if(whole===0) return hit[1];
    return `${whole} ${hit[1]}`;
  }
  return rounded.toLocaleString('de-DE',{maximumFractionDigits:2});
}

function scaleNumberToken(raw,factor){
  const n=Number(String(raw).replace(',','.'));
  return Number.isFinite(n)?niceAmount(n*factor):raw;
}

function scaleNeedLine(line,factor){
  if(!factor || Math.abs(factor-1)<0.0001) return line;

  // Mengen mit Küchen-/Gewichtseinheit, egal ob am Anfang oder mitten im Satz.
  let out=line.replace(/(\d+(?:[.,]\d+)?)\s*(kg|g|ml|l|EL|TL)\b/gi,
    (_,num,unit)=>`${scaleNumberToken(num,factor)} ${unit}`);

  // Stückangaben / zählbare Zutaten, die in den Kochschritten vorkommen.
  const countWords='Eier?|Paprika|Tomaten?|Gurken?|Zwiebeln?|Pastinaken?|Blumenkohl|Schalotten?|Radieschen|Knoblauchzehen?|Feta|Schafskäse|Chicorée|Orangen?|Champignons?|Pilze?|Kartoffeln?|Möhren?|Karotten?|Kohlrabi|Auberginen?|Frühlingszwiebeln?';
  // Erlaubt Adjektive zwischen Zahl und Zutat, z. B. „3 rote Paprika“ oder „1 große Zwiebel“.
  const re=new RegExp(`\\b(\\d+(?:[.,]\\d+)?)(\\s+(?:(?!${countWords}\\b)[A-Za-zÄÖÜäöüß-]+\\s+){0,3})(${countWords})\\b`,'gi');
  out=out.replace(re,(_,num,middle,word)=>`${scaleNumberToken(num,factor)}${middle}${word}`);

  return out;
}

function scaleInstructionText(line,factor){
  if(!factor || Math.abs(factor-1)<0.0001) return line;

  // Nur Zutatenmengen skalieren – niemals Zeiten, Temperaturen oder TM6-Stufen.
  let out=line.replace(/(\d+(?:[.,]\d+)?)\s*(kg|g|ml|l|EL|TL)\b/gi,
    (_,num,unit)=>`${scaleNumberToken(num,factor)} ${unit}`);

  const countWords='Eier?|Paprika|Tomaten?|Gurken?|Zwiebeln?|Pastinaken?|Blumenkohl|Schalotten?|Radieschen|Knoblauchzehen?|Feta|Schafskäse|Chicorée|Orangen?|Champignons?|Pilze?|Kartoffeln?|Möhren?|Karotten?|Kohlrabi|Auberginen?|Frühlingszwiebeln?';
  // Erlaubt Adjektive zwischen Zahl und Zutat, z. B. „3 rote Paprika“ oder „1 große Zwiebel“.
  const re=new RegExp(`\\b(\\d+(?:[.,]\\d+)?)(\\s+(?:(?!${countWords}\\b)[A-Za-zÄÖÜäöüß-]+\\s+){0,3})(${countWords})\\b`,'gi');
  out=out.replace(re,(_,num,middle,word)=>`${scaleNumberToken(num,factor)}${middle}${word}`);
  return out;
}

    if(filter==='buy') return r.category!=='Vorrat prüfen' && !r.checked;
    if(filter==='check') return r.category==='Vorrat prüfen' && !r.checked;
    if(filter==='done') return r.checked;
    return true;
  });
  const bc=rows.filter(r=>r.category!=='Vorrat prüfen'&&!r.checked).length;
  const cc=rows.filter(r=>r.category==='Vorrat prüfen'&&!r.checked).length;
  const dc=rows.filter(r=>r.checked).length;
  document.getElementById('app').innerHTML=`<main class="shell">
  <header><div><div class="eyebrow">SO–FR · 30.08.–04.09.</div><h1>Einkaufsliste</h1></div><div class="actions"><button class="icon" onclick="loadRows()">↻</button><button class="icon" onclick="logout()">⇥</button></div></header>
  <section class="stats"><div><b>${bc}</b><span>zu kaufen</span></div><div><b>${cc}</b><span>Vorrat prüfen</span></div><div><b>${dc}</b><span>erledigt</span></div></section>
  <div class="search">⌕<input placeholder="Artikel suchen" value="${esc(query)}" oninput="query=this.value;renderShopping()"></div>
  <div class="filters">${[['all','Alle'],['buy','Zu kaufen'],['check','Prüfen'],['done','Erledigt']].map(x=>`<button class="${filter===x[0]?'active':''}" onclick="filter='${x[0]}';renderShopping()">${x[1]}</button>`).join('')}</div>
  ${msg?`<div class="notice"><div>${esc(msg)}</div>${userId&&msg.includes('noch kein Haushalt')?`<div class="uid"><code>${esc(userId)}</code><button onclick="copyUid()">User-ID kopieren</button></div>`:''}</div>`:''}
  <section class="notice" style="margin-bottom:12px;background:#edf3e9;border-color:#d7e2d0">
    <div><b>Aktueller Plan bis Freitagmittag</b><br><span class="muted">Vorrat und bereits gekaufte Artikel werden berücksichtigt. Neue Zutaten für Mi–Fr sind ergänzt.</span></div>
  </section>
  <section class="list">${vis.map(r=>`<article class="item ${r.checked?'done':''}"><button class="check" onclick="toggle('${r.id}')">${r.checked?'✓':''}</button><div class="body"><div class="top"><h2>${esc(r.foods?.name||'Unbekannter Artikel')}</h2><span class="pill ${r.category==='Vorrat prüfen'?'warn':''}">${esc(r.category==='Vorrat prüfen'?'prüfen':formatBuy(r))}</span></div><p class="desc">${esc(reason(r))}</p>${r.needed_by?`<div class="meta">benötigt ${new Date(r.needed_by+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}</div>`:''}${!r.checked&&r.category!=='Vorrat prüfen'?`<button onclick="openRealPurchase('${r.id}')" style="margin-top:10px;padding:10px 14px;border:0;border-radius:14px;background:#294936;color:white;font-weight:700">Gekauft · echte Packung eingeben</button>`:''}${r.checked?`<button onclick="putAway('${r.id}')" style="margin-top:10px;padding:10px 14px;border:0;border-radius:14px;background:#294936;color:white;font-weight:700">Eingeräumt</button>`:''}</div></article>`).join('')}</section>
  <nav class="bottom"><span onclick="activeTab='today';renderApp()">Heute</span><span onclick="activeTab='plan';renderApp()">Plan</span><span onclick="activeTab='recipes';recipeOpen=null;renderApp()">Rezepte</span><span onclick="activeTab='inventory';loadInventory()">Vorrat</span><b onclick="activeTab='shopping';renderApp()">Einkauf</b></nav></main>`;
}

function renderApp(){
  if(activeTab==='shopping') renderShopping();
  else if(activeTab==='plan') renderPlan();
  else if(activeTab==='recipes') renderRecipes();
  else if(activeTab==='inventory') renderInventory();
  else renderToday();
}
async function login(){
  const email=document.getElementById('email').value, password=document.getElementById('password').value;
  const {error}=await sb.auth.signInWithPassword({email,password});
  const el=document.getElementById('loginmsg'); if(error){el.textContent=error.message;el.classList.remove('hidden')}
}
async function signup(){
  const email=document.getElementById('email').value, password=document.getElementById('password').value;
  const {error}=await sb.auth.signUp({email,password});
  const el=document.getElementById('loginmsg'); el.textContent=error?error.message:'Konto angelegt. Falls eine Bestätigungsmail kommt, bitte den Link darin öffnen.';el.classList.remove('hidden');
}
async function logout(){await sb.auth.signOut();}
async function copyUid(){await navigator.clipboard.writeText(userId);alert('User-ID kopiert');}
async function toggle(id){
  const r=rows.find(x=>x.id===id); if(!r)return; const next=!r.checked; r.checked=next; renderApp();
  const {error}=await sb.from('shopping_items').update({checked:next}).eq('id',id);
  if(error){r.checked=!next;msg='Abhaken konnte nicht gespeichert werden: '+error.message;renderApp()}
}

async function loadPreparedMeals(){
  if(!householdId){preparedMealRows=[];return;}
  const {data,error}=await sb.from('prepared_meals').select('id,recipe_id,name,portions,location,cooked_at,status').eq('household_id',householdId).gt('portions',0).order('cooked_at',{ascending:false});
  preparedMealRows=error?[]:(data||[]);
}

async function loadInventory(){
  if(!householdId){activeTab='inventory';renderApp();return;}
  await loadPreparedMeals();
  const [{data:inv,error},{data:foodsData,error:foodsError}] = await Promise.all([
    sb.from('inventory_items')
      .select('id,food_id,quantity,unit,location,quantity_status,opened,foods(name)')
      .eq('household_id',householdId).order('location',{ascending:true}),
    sb.from('foods').select('id,name,default_unit').order('name',{ascending:true})
  ]);
  inventoryRows=error?[]:(inv||[]);
  foodOptions=foodsError?[]:(foodsData||[]);
  if(error) msg='Vorrat konnte nicht geladen werden: '+error.message;
  activeTab='inventory'; renderApp();
}

function openInventoryEditor(id=null){
  inventoryEditId=id;
  const r=id?inventoryRows.find(x=>x.id===id):null;
  const name=r?.foods?.name||'';
  const qty=r?.quantity??'';
  const unit=r?.unit||'';
  const loc=r?.location||'Kühlschrank';
  const status=r?.quantity_status||'known';
  const opened=!!r?.opened;

  const overlay=document.createElement('div');
  overlay.id='inventoryEditor';
  overlay.style='position:fixed;inset:0;background:rgba(20,30,24,.42);z-index:9999;display:flex;align-items:flex-end;justify-content:center;padding:12px';
  overlay.innerHTML=`<section style="width:min(620px,100%);max-height:90vh;overflow:auto;background:#fffdf7;border-radius:26px 26px 18px 18px;padding:20px;box-shadow:0 -10px 40px rgba(0,0,0,.18)">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div><div class="eyebrow">${id?'BESTAND BEARBEITEN':'NEUER VORRAT'}</div><h2 style="margin:4px 0 0">${id?esc(name):'Vorrat hinzufügen'}</h2></div>
      <button class="icon" onclick="closeInventoryEditor()">×</button>
    </div>

    ${id?`<input id="invFoodId" type="hidden" value="${r.food_id}">`:
      `<label style="display:block;margin-top:18px">Lebensmittel
        <input id="invFoodName" list="foodList" placeholder="z. B. Joghurt 1,5 %" autocomplete="off" style="width:100%">
        <datalist id="foodList">${foodOptions.map(f=>`<option value="${esc(f.name)}"></option>`).join('')}</datalist>
      </label>`}

    <div style="display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin-top:14px">
      <label>Menge
        <input id="invQty" inputmode="decimal" type="number" step="0.01" min="0" value="${esc(String(qty))}" placeholder="z. B. 8" style="width:100%">
      </label>
      <label>Einheit
        <input id="invUnit" value="${esc(unit)}" placeholder="g, ml, Stück …" style="width:100%">
      </label>
    </div>

    <label style="display:block;margin-top:14px">Lagerort
      <input id="invLoc" value="${esc(loc)}" placeholder="Kühlschrank, Vorratsschrank …" style="width:100%">
    </label>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
      <label>Status
        <select id="invStatus" style="width:100%;padding:12px;border-radius:12px;border:1px solid #d8d2c3;background:white">
          <option value="known" ${status==='known'?'selected':''}>genau</option>
          <option value="estimated" ${status==='estimated'?'selected':''}>geschätzt</option>
          <option value="low" ${status==='low'?'selected':''}>wenig</option>
          <option value="unknown" ${status==='unknown'?'selected':''}>unklar</option>
        </select>
      </label>
      <label style="display:flex;align-items:center;gap:10px;padding-top:27px">
        <input id="invOpened" type="checkbox" ${opened?'checked':''}> geöffnet
      </label>
    </div>

    <div class="notice" style="margin-top:14px;background:#edf3e9;border-color:#d7e2d0">
      <div><b>Manuelle Eingabe hat Vorrang</b><br><span class="muted">Wenn du „genau“ auswählst, gilt diese Menge als echter Bestand und ersetzt die bisherige Schätzung.</span></div>
    </div>

    <div style="display:flex;gap:10px;margin-top:16px">
      ${id?`<button class="secondary" style="flex:1" onclick="markInventoryEmpty('${id}')">Aufgebraucht</button>`:''}
      <button class="primary" style="flex:2" onclick="saveInventoryEditor()">Speichern</button>
    </div>
  </section>`;
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeInventoryEditor()});
  document.body.appendChild(overlay);
}

function closeInventoryEditor(){
  document.getElementById('inventoryEditor')?.remove();
}

async function saveInventoryEditor(){
  const qtyRaw=document.getElementById('invQty').value;
  const qty=qtyRaw===''?null:Number(qtyRaw);
  const unit=document.getElementById('invUnit').value.trim();
  const location=document.getElementById('invLoc').value.trim()||'Ohne Ort';
  const quantity_status=document.getElementById('invStatus').value;
  const opened=document.getElementById('invOpened').checked;

  if(qty!==null && (Number.isNaN(qty)||qty<0)){alert('Bitte eine gültige Menge eingeben.');return;}

  let foodId;
  if(inventoryEditId){
    foodId=document.getElementById('invFoodId').value;
  }else{
    const name=document.getElementById('invFoodName').value.trim();
    if(!name){alert('Bitte ein Lebensmittel auswählen oder eingeben.');return;}
    let food=foodOptions.find(f=>f.name.toLowerCase()===name.toLowerCase());
    if(!food){
      const {data,error}=await sb.from('foods').insert({name,default_unit:unit||null}).select('id,name,default_unit').single();
      if(error){alert('Lebensmittel konnte nicht angelegt werden: '+error.message);return;}
      food=data;
      foodOptions.push(food);
    }
    foodId=food.id;
  }

  let error;
  if(inventoryEditId){
    ({error}=await sb.from('inventory_items').update({
      quantity:qty,unit:unit||null,location,quantity_status,opened,last_checked_at:new Date().toISOString()
    }).eq('id',inventoryEditId).eq('household_id',householdId));
  }else{
    const existing=inventoryRows.find(r=>r.food_id===foodId && (r.location||'')===location);
    if(existing){
      ({error}=await sb.from('inventory_items').update({
        quantity:qty,unit:unit||null,quantity_status,opened,last_checked_at:new Date().toISOString()
      }).eq('id',existing.id).eq('household_id',householdId));
    }else{
      ({error}=await sb.from('inventory_items').insert({
        household_id:householdId,food_id:foodId,quantity:qty,unit:unit||null,location,quantity_status,opened,last_checked_at:new Date().toISOString()
      }));
    }
  }
  if(error){alert('Bestand konnte nicht gespeichert werden: '+error.message);return;}

  await recalcShoppingForFood(foodId,qty,unit,quantity_status);
  closeInventoryEditor();
  inventoryEditId=null;
  await loadInventory();
}

async function markInventoryEmpty(id){
  const r=inventoryRows.find(x=>x.id===id);
  if(!r)return;
  const {error}=await sb.from('inventory_items').update({
    quantity:0,quantity_status:'known',last_checked_at:new Date().toISOString()
  }).eq('id',id).eq('household_id',householdId);
  if(error){alert('Konnte nicht als aufgebraucht speichern: '+error.message);return;}
  await recalcShoppingForFood(r.food_id,0,r.unit,'known');
  closeInventoryEditor();
  inventoryEditId=null;
  await loadInventory();
}

function unitSimple(u){
  return (u||'').toLowerCase().trim()
    .replace('stück','st').replace('stck','st').replace('stk','st')
    .replace('gramm','g').replace('kilogramm','kg')
    .replace('milliliter','ml').replace('liter','l');
}

async function recalcShoppingForFood(foodId,qty,unit,status){
  if(status!=='known' || qty===null) return;
  const {data:items,error}=await sb.from('shopping_items')
    .select('id,required_quantity,required_unit,covered_by_delivery,package_size,packages_to_buy,checked')
    .eq('household_id',householdId).eq('food_id',foodId);
  if(error || !items?.length) return;

  for(const item of items){
    if(unitSimple(item.required_unit)!==unitSimple(unit)) continue;
    const required=Number(item.required_quantity||0);
    const delivery=Number(item.covered_by_delivery||0);
    const covered=Math.min(Number(qty||0),required);
    const toBuy=Math.max(0,required-covered-delivery);
    const pack=Number(item.package_size||0);
    const packages=pack>0?Math.ceil(toBuy/pack):(toBuy>0?1:0);
    await sb.from('shopping_items').update({
      covered_by_inventory:covered,
      quantity_to_buy:toBuy,
      packages_to_buy:packages,
      checked:toBuy===0 ? true : item.checked
    }).eq('id',item.id);
  }
}

async function putAway(id){
  const {data,error}=await sb.rpc('put_away_shopping_item',{p_shopping_item_id:id});
  if(error){alert('Einräumen nicht möglich: '+error.message);return;}
  alert(`Eingeräumt: ${data.quantity_added} ${data.unit}`);
  await loadRows();
}

async function loadRows(){
  msg='';
  rows=[];
  householdId='';

  const {data:member,error:memberError}=await sb
    .from('household_members')
    .select('household_id')
    .eq('user_id',userId)
    .limit(1)
    .maybeSingle();

  if(memberError){
    msg='Haushaltszuordnung konnte nicht geprüft werden: '+memberError.message;
    renderApp();
    return;
  }

  if(!member?.household_id){
    msg='Du bist angemeldet, aber diesem Supabase-Nutzer ist noch kein Haushalt zugeordnet.';
    renderApp();
    return;
  }

  householdId=member.household_id;

  const {data,error}=await sb
    .from('shopping_items')
    .select('id,household_id,food_id,required_quantity,required_unit,covered_by_inventory,covered_by_delivery,quantity_to_buy,package_size,package_unit,packages_to_buy,category,checked,manually_added,needed_by,foods(name)')
    .eq('household_id',householdId)
    .order('needed_by',{ascending:true});

  if(error){
    msg='Einkaufsliste konnte nicht geladen werden: '+error.message;
    rows=[];
  } else {
    rows=data||[];
    if(!rows.length) msg='Haushalt erkannt – aktuell sind keine Einkaufsposten vorhanden.';
  }
  renderApp();
}
sb.auth.getSession().then(async ({data})=>{if(data.session){userId=data.session.user.id;await loadRows()}else renderLogin()});
sb.auth.onAuthStateChange((_e,session)=>{if(session){userId=session.user.id;setTimeout(loadRows,0)}else{rows=[];householdId='';userId='';renderLogin()}});
</script>
</body></html>
