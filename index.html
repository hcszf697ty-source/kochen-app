function formatBuy(r){
  if(r.packages_to_buy && r.package_size && r.package_unit){
    if(r.packages_to_buy===1){
      if(['Stück','Knolle','Tube','Bund','Packung'].includes(r.package_unit)) return '1 '+r.package_unit;
      return Number(r.package_size).toLocaleString('de-DE')+' '+r.package_unit;
    }
    return r.packages_to_buy+' × '+Number(r.package_size).toLocaleString('de-DE')+' '+r.package_unit;
  }
  if(r.quantity_to_buy!=null && r.required_unit) return Number(r.quantity_to_buy).toLocaleString('de-DE')+' '+r.required_unit;
  return 'prüfen';
}
function reason(r){
  const inv=Number(r.covered_by_inventory||0), del=Number(r.covered_by_delivery||0);
  if(r.category==='Vorrat prüfen') return 'Bestand noch nicht sicher bestätigt';
  if(inv>0 && del>0) return 'Vorrat + Lieferung berücksichtigt';
  if(inv>0) return 'Vorrat bereits abgezogen';
  if(del>0) return 'Biokiste rechtzeitig berücksichtigt';
  return 'Für den Plan noch erforderlich';
}

      {title:'Zwiebel & Knoblauch',needs:['1 große Zwiebel, halbiert','2 Knoblauchzehen'],text:'Zwiebel und Knoblauch in den Mixtopf geben und zerkleinern. Mit dem Spatel nach unten schieben.',setting:'5 Sek. · Stufe 5',book:'TM6-Adaption des Kochbuchrezepts.'},
      {title:'Paprika dünsten',needs:['3 rote Paprika, in Stücken','1 EL Olivenöl'],text:'Paprika zugeben und kurz zerkleinern. Olivenöl zugeben und dünsten.',setting:'4 Sek. · Stufe 4 · danach 5 Min. · 120 °C · Linkslauf · Stufe 1',book:'Für eine stückige Sauce Linkslauf verwenden.'},
      {title:'Sauce garen',needs:['400 g stückige Tomaten mit Kräutern','3 EL Tomatenmark','italienische Kräuter','Salz','Pfeffer','Zucker','Paprika'],text:'Tomaten, Tomatenmark und die im Kochbuch genannten Gewürze zugeben und garen.',setting:'10 Min. · 100 °C · Linkslauf · Stufe 1',book:'TM6-Adaption; Gewürze nach Kochbuch.'},
      {title:'Auflaufform füllen',needs:['Paprika-Tomaten-Sauce','4 × 180 g Feta/Schafskäse','Thymian','Rosmarin'],text:'Sauce in eine große Auflaufform geben. Die vier Feta-Stücke daraufsetzen und mit Thymian und Rosmarin bestreuen.',setting:'Vorbereitung Backofen',book:'1 Kochbuch-Rezeptmenge für 4 Personen.'},

function startCook(key){
  if(!tm6Cook[key]){
    alert('Für dieses Rezept ist der TM6-Kochmodus noch nicht hinterlegt.');
    return;
  }
  cookMode=key;
  cookStep=0;
  renderCookMode();
}


async function finishCook(){
  const title=tm6Cook[cookMode].title;
  const {data:recipe}=await sb.from('recipes').select('id,title').eq('household_id',householdId).eq('title',title).maybeSingle();
  if(!recipe){alert('Rezept konnte nicht mit dem Vorrat verknüpft werden.');return;}
  let excluded=[];
  if(title==='Blumenkohlsuppe'){
    const {data:p}=await sb.from('foods').select('id').eq('name','Pastinake').maybeSingle();
    if(p?.id) excluded=[p.id];
  }
  let y=prompt('Wie viele Teller/Portionen hat die Kochrunde ergeben?',tm6Cook[cookMode].defaultYield??'');
  if(y===null)return;
  let p=prompt('Wie viele Portionen bleiben jetzt übrig und sollen als fertiges Essen in den Vorrat?','');
  if(p===null)return;
  const {data,error}=await sb.rpc('consume_recipe_v2',{
    p_recipe_id:recipe.id,p_cook_token:cookToken,p_multiplier:1,
    p_yield_portions:y.trim()===''?null:Number(y.replace(',','.')),
    p_portions_remaining:p.trim()===''?null:Number(p.replace(',','.')),
    p_excluded_food_ids:excluded
  });
  if(error){alert('Vorrat konnte nicht abgebucht werden: '+error.message);return;}
  if(data?.duplicate){
    alert('Diese Kochrunde wurde bereits verbucht ✓\n\nEs wurde nichts ein zweites Mal vom Vorrat abgezogen.');
    return;
  }
  const est=data?.tracked_estimated||[];
  const untracked=data?.tracked_unquantified||[];
  if(est.length || untracked.length){
    const bits=[];
    if(est.length) bits.push(`${est.length} geschätzte Vorräte wurden als Verbrauch protokolliert`);
    if(untracked.length) bits.push(`${untracked.length} noch nicht angelegte Vorräte wurden als Verbrauch erfasst`);
    alert(`Gekocht ✓\n\n${bits.join('. ')}.\n\nEs wurde keine falsche Restmenge erfunden.`);
  } else {
    alert('Gekocht ✓ Zutaten wurden mengenmäßig aus dem Vorrat abgebucht.');
  }
  const finishedKey=cookMode; cookMode=null;cookToken=null;recipeOpen=finishedKey;activeTab='recipes';renderRecipes();
}

function renderCookMode(){
  const c=tm6Cook[cookMode], s=c.steps[cookStep];
  const pct=Math.round(((cookStep+1)/c.steps.length)*100);
  document.getElementById('app').innerHTML=`<main class="shell">
    <header>
      <div><div class="eyebrow">TM6-KOCHMODUS · ${cookStep+1}/${c.steps.length}</div><h1 style="font-size:38px">${c.title}</h1></div>
      <div class="actions"><button class="icon" onclick="recipeOpen=cookMode;cookMode=null;renderRecipes()">×</button></div>
    </header>

    <div style="height:8px;background:#e5e6df;border-radius:999px;overflow:hidden;margin:6px 0 18px">
      <div style="height:100%;width:${pct}%;background:#294936;border-radius:999px"></div>
    </div>

    ${c.adaptation?`<section class="notice" style="background:#fff4d9;border-color:#ead39a">
      <div><b>Anpassung</b><br>${c.adaptation}</div>
    </section>`:''}

    <section class="item" style="margin-top:18px;min-height:300px;display:flex;align-items:center">
      <div class="body" style="width:100%">
        <div class="eyebrow">SCHRITT ${cookStep+1}</div>
        <h2 style="font-size:32px;margin:8px 0 18px">${s.title}</h2>
        ${s.needs&&s.needs.length?`<div style="margin:0 0 18px;padding:16px;border-radius:18px;background:#fff8e8"><b>Jetzt brauchst du</b><div style="margin-top:8px;line-height:1.6">${s.needs.map(x=>`• ${x}`).join('<br>')}</div></div>`:''}
        <p class="desc" style="font-size:22px;line-height:1.45">${s.text}</p>
        <div style="margin-top:26px;padding:20px;border-radius:20px;background:#edf3e9;text-align:center;font-size:24px;font-weight:800">${s.setting}</div>
      </div>
    </section>

    <section class="notice" style="margin-top:14px">
      <div><b>Kochbuch → TM6</b><br><span class="muted">${s.book}</span></div>
    </section>

    <div style="display:grid;grid-template-columns:${cookStep===0?'1fr':'1fr 2fr'};gap:12px;margin-top:18px">
      ${cookStep>0?`<button onclick="cookStep--;renderCookMode()" style="padding:18px;border:1px solid #d9d7ca;border-radius:20px;background:#fffdf8;font-size:18px;font-weight:700">Zurück</button>`:''}
      <button onclick="${cookStep<c.steps.length-1?'cookStep++;renderCookMode()':'finishCook()'}" style="padding:18px;border:0;border-radius:20px;background:#183425;color:white;font-size:20px;font-weight:800">${cookStep<c.steps.length-1?'Weiter':'Gekocht & Vorrat abbuchen'}</button>
    </div>
  </main>`;
}

function renderRecipes(){
  if(recipeOpen) return renderRecipeDetail(recipeOpen);

  document.getElementById('app').innerHTML=`<main class="shell">
  <header><div><div class="eyebrow">KOCHBUCH · SO–DI</div><h1>Rezepte</h1></div><div class="actions"><button class="icon" onclick="loadRows()">↻</button><button class="icon" onclick="logout()">⇥</button></div></header>

  <section class="notice" style="background:#edf3e9;border-color:#d7e2d0">
    <div><b>Original & Anpassung getrennt</b><br><span class="muted">Die Kochbuchzutaten bleiben sichtbar; Änderungen stehen extra dabei.</span></div>
  </section>

  <section class="list">
    ${Object.entries(recipeData).map(([key,r])=>`
      <article class="item" onclick="recipeOpen='${key}';renderRecipes()" style="cursor:pointer">
        <div class="body">
          <div class="top"><h2>${r.title}</h2><span class="pill">${r.phase}</span></div>
          <p class="desc">${r.meta}</p>
          ${r.adaptation?`<div class="meta"><b>Anpassung:</b> ${r.adaptation}</div>`:''}
          <div class="meta">Rezept öffnen ›</div>
        </div>
      </article>`).join('')}
  </section>

  <nav class="bottom"><span onclick="activeTab='today';renderApp()">Heute</span><span onclick="activeTab='plan';renderApp()">Plan</span><b onclick="activeTab='recipes';recipeOpen=null;renderApp()">Rezepte</b><span onclick="activeTab='inventory';loadInventory()">Vorrat</span><span onclick="activeTab='shopping';renderApp()">Einkauf</span></nav></main>`;
}

function renderRecipeDetail(key){
  const r=recipeData[key];
  document.getElementById('app').innerHTML=`<main class="shell">
  <header><div><div class="eyebrow">${r.phase}</div><h1 style="font-size:38px">${r.title}</h1></div><div class="actions"><button class="icon" onclick="recipeOpen=null;renderRecipes()">←</button></div></header>

  <section class="notice" style="background:#edf3e9;border-color:#d7e2d0">
    <div><b>${r.meta}</b><br><span class="muted">Quelle: Schlank mit Genuss – Das Bauchweg Kochbuch</span></div>
  </section>

  <section class="item" style="margin-top:14px">
    <div class="body">
      <div class="top"><h2>Originalzutaten</h2><span class="pill">Kochbuch</span></div>
      <div class="desc" style="line-height:1.7">${r.ingredients.map(x=>`• ${x}`).join('<br>')}</div>
    </div>
  </section>

  ${r.adaptation?`
  <section class="notice" style="margin-top:14px;background:#fff4d9;border-color:#ead39a">
    <div><b>Anpassung für euren Plan</b><br>${r.adaptation}<br><span class="muted">${r.note}</span></div>
  </section>`:
  `<section class="notice" style="margin-top:14px"><div><b>Hinweis</b><br><span class="muted">${r.note}</span></div></section>`}

  <button onclick="startCook('${key}')" style="width:100%;margin-top:18px;padding:18px;border:0;border-radius:22px;background:#183425;color:white;font-size:20px;font-weight:700">
    Im TM6 kochen
  </button>

  <nav class="bottom"><span onclick="recipeOpen=null;activeTab='today';renderApp()">Heute</span><span onclick="recipeOpen=null;activeTab='plan';renderApp()">Plan</span><b onclick="recipeOpen=null;activeTab='recipes';renderApp()">Rezepte</b><span onclick="activeTab='inventory';loadInventory()">Vorrat</span><span onclick="recipeOpen=null;activeTab='shopping';renderApp()">Einkauf</span></nav></main>`;
}


function renderInventory(){
  const groups={};
  for(const r of inventoryRows){const loc=r.location||'Ohne Ort';(groups[loc] ||= []).push(r);}
  document.getElementById('app').innerHTML=`<main class="shell">
  <header><div><div class="eyebrow">LIVE AUS SUPABASE</div><h1>Vorrat</h1></div><div class="actions"><button class="icon" onclick="loadInventory()">↻</button><button class="icon" onclick="logout()">⇥</button></div></header>
  <section class="notice" style="background:#edf3e9;border-color:#d7e2d0"><div><b>${inventoryRows.length} Vorratsposten</b><br><span class="muted">Einkäufe mit „Eingeräumt“ landen automatisch hier. Beim Kochen werden exakte Mengen abgezogen; geschätzte Bestände werden nur als Verbrauch protokolliert.</span></div></section>
  ${Object.entries(groups).map(([loc,items])=>`<section style="margin-top:18px"><div class="eyebrow" style="margin-bottom:8px">${esc(loc)}</div><div class="list">
  ${items.map(r=>`<article class="item"><div class="body"><div class="top"><h2>${esc(r.foods?.name||'Unbekannt')}</h2><span class="pill ${r.quantity_status==='low'?'warn':''}">${r.quantity==null?'Menge unklar':esc(String(r.quantity)+' '+(r.unit||''))}</span></div><div class="meta">${esc(r.quantity_status||'')}${r.opened?' · geöffnet':''}</div></div></article>`).join('')}
  </div></section>`).join('')}
  <nav class="bottom"><span onclick="activeTab='today';renderApp()">Heute</span><span onclick="activeTab='plan';renderApp()">Plan</span><span onclick="activeTab='recipes';recipeOpen=null;renderApp()">Rezepte</span><b onclick="loadInventory()">Vorrat</b><span onclick="activeTab='shopping';renderApp()">Einkauf</span></nav></main>`;
}

function renderShopping(){
  const vis=rows.filter(r=>{
    const name=(r.foods?.name||'').toLowerCase();
    if(query && !name.includes(query.toLowerCase())) return false;
    if(filter==='buy') return r.category!=='Vorrat prüfen' && !r.checked;
    if(filter==='check') return r.category==='Vorrat prüfen' && !r.checked;
    if(filter==='done') return r.checked;
    return true;
  });
  const bc=rows.filter(r=>r.category!=='Vorrat prüfen'&&!r.checked).length;
  const cc=rows.filter(r=>r.category==='Vorrat prüfen'&&!r.checked).length;
  const dc=rows.filter(r=>r.checked).length;
  document.getElementById('app').innerHTML=`<main class="shell">
  <header><div><div class="eyebrow">SO–FR · 30.08.–04.09.</div><h1>Einkaufsliste</h1></div><div class="actions"><button class="icon" onclick="loadRows()">↻</button><button class="icon" onclick="logout()">⇥</button></div></header>
  <section class="stats"><div><b>${bc}</b><span>zu kaufen</span></div><div><b>${cc}</b><span>Vorrat prüfen</span></div><div><b>${dc}</b><span>erledigt</span></div></section>
  <div class="search">⌕<input placeholder="Artikel suchen" value="${esc(query)}" oninput="query=this.value;renderShopping()"></div>
  <div class="filters">${[['all','Alle'],['buy','Zu kaufen'],['check','Prüfen'],['done','Erledigt']].map(x=>`<button class="${filter===x[0]?'active':''}" onclick="filter='${x[0]}';renderShopping()">${x[1]}</button>`).join('')}</div>
  ${msg?`<div class="notice"><div>${esc(msg)}</div>${userId&&msg.includes('noch kein Haushalt')?`<div class="uid"><code>${esc(userId)}</code><button onclick="copyUid()">User-ID kopieren</button></div>`:''}</div>`:''}
  <section class="notice" style="margin-bottom:12px;background:#edf3e9;border-color:#d7e2d0">
    <div><b>Aktueller Plan bis Freitagmittag</b><br><span class="muted">Vorrat und bereits gekaufte Artikel werden berücksichtigt. Neue Zutaten für Mi–Fr sind ergänzt.</span></div>
  </section>
  <section class="list">${vis.map(r=>`<article class="item ${r.checked?'done':''}"><button class="check" onclick="toggle('${r.id}')">${r.checked?'✓':''}</button><div class="body"><div class="top"><h2>${esc(r.foods?.name||'Unbekannter Artikel')}</h2><span class="pill ${r.category==='Vorrat prüfen'?'warn':''}">${esc(r.category==='Vorrat prüfen'?'prüfen':formatBuy(r))}</span></div><p class="desc">${esc(reason(r))}</p>${r.needed_by?`<div class="meta">benötigt ${new Date(r.needed_by+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}</div>`:''}${r.checked?`<button onclick="putAway('${r.id}')" style="margin-top:10px;padding:10px 14px;border:0;border-radius:14px;background:#294936;color:white;font-weight:700">Eingeräumt</button>`:''}</div></article>`).join('')}</section>
  <nav class="bottom"><span onclick="activeTab='today';renderApp()">Heute</span><span onclick="activeTab='plan';renderApp()">Plan</span><span onclick="activeTab='recipes';recipeOpen=null;renderApp()">Rezepte</span><span onclick="activeTab='inventory';loadInventory()">Vorrat</span><b onclick="activeTab='shopping';renderApp()">Einkauf</b></nav></main>`;
}

function renderApp(){
  if(activeTab==='shopping') renderShopping();
  else if(activeTab==='plan') renderPlan();
  else if(activeTab==='recipes') renderRecipes();
  else if(activeTab==='inventory') renderInventory();
  else renderToday();
}
async function login(){
  const email=document.getElementById('email').value, password=document.getElementById('password').value;
  const {error}=await sb.auth.signInWithPassword({email,password});
  const el=document.getElementById('loginmsg'); if(error){el.textContent=error.message;el.classList.remove('hidden')}
}
async function signup(){
  const email=document.getElementById('email').value, password=document.getElementById('password').value;
  const {error}=await sb.auth.signUp({email,password});
  const el=document.getElementById('loginmsg'); el.textContent=error?error.message:'Konto angelegt. Falls eine Bestätigungsmail kommt, bitte den Link darin öffnen.';el.classList.remove('hidden');
}
async function logout(){await sb.auth.signOut();}
async function copyUid(){await navigator.clipboard.writeText(userId);alert('User-ID kopiert');}
async function toggle(id){
  const r=rows.find(x=>x.id===id); if(!r)return; const next=!r.checked; r.checked=next; renderApp();
  const {error}=await sb.from('shopping_items').update({checked:next}).eq('id',id);
  if(error){r.checked=!next;msg='Abhaken konnte nicht gespeichert werden: '+error.message;renderApp()}
}

async function loadInventory(){
  if(!householdId){activeTab='inventory';renderApp();return;}
  const {data,error}=await sb.from('inventory_items')
    .select('id,food_id,quantity,unit,location,quantity_status,opened,foods(name)')
    .eq('household_id',householdId).order('location',{ascending:true});
  inventoryRows=error?[]:(data||[]);
  if(error) msg='Vorrat konnte nicht geladen werden: '+error.message;
  activeTab='inventory'; renderApp();
}
async function putAway(id){
  const {data,error}=await sb.rpc('put_away_shopping_item',{p_shopping_item_id:id});
  if(error){alert('Einräumen nicht möglich: '+error.message);return;}
  alert(`Eingeräumt: ${data.quantity_added} ${data.unit}`);
  await loadRows();
}

async function loadRows(){
  msg='';
  rows=[];
  householdId='';

  const {data:member,error:memberError}=await sb
    .from('household_members')
    .select('household_id')
    .eq('user_id',userId)
    .limit(1)
    .maybeSingle();

  if(memberError){
    msg='Haushaltszuordnung konnte nicht geprüft werden: '+memberError.message;
    renderApp();
    return;
  }

  if(!member?.household_id){
    msg='Du bist angemeldet, aber diesem Supabase-Nutzer ist noch kein Haushalt zugeordnet.';
    renderApp();
    return;
  }

  householdId=member.household_id;

  const {data,error}=await sb
    .from('shopping_items')
    .select('id,household_id,food_id,required_quantity,required_unit,covered_by_inventory,covered_by_delivery,quantity_to_buy,package_size,package_unit,packages_to_buy,category,checked,manually_added,needed_by,foods(name)')
    .eq('household_id',householdId)
    .order('needed_by',{ascending:true});

  if(error){
    msg='Einkaufsliste konnte nicht geladen werden: '+error.message;
    rows=[];
  } else {
    rows=data||[];
    if(!rows.length) msg='Haushalt erkannt – aktuell sind keine Einkaufsposten vorhanden.';
  }
  renderApp();
}
sb.auth.getSession().then(async ({data})=>{if(data.session){userId=data.session.user.id;await loadRows()}else renderLogin()});
sb.auth.onAuthStateChange((_e,session)=>{if(session){userId=session.user.id;setTimeout(loadRows,0)}else{rows=[];householdId='';userId='';renderLogin()}});
</script>
</body></html>
