<style>
:root{--bg:#f7f2e8;--card:#fffdf8;--ink:#223226;--muted:#738070;--green:#294f38;--sage:#dce6d8;--oat:#eadfca;--terr:#b96746;--line:#e7dfd2}
*{box-sizing:border-box} body{margin:0;font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}
.shell{max-width:760px;margin:auto;min-height:100vh;padding:22px 18px 94px}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}h1{font-size:36px;line-height:1;margin:4px 0}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.actions{display:flex;gap:8px}.icon{width:42px;height:42px;border:0;border-radius:14px;background:var(--card);box-shadow:0 4px 18px #0000000d}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stats div{background:var(--card);padding:14px;border-radius:18px;text-align:center}.stats b{display:block;font-size:24px}.stats span{font-size:12px;color:var(--muted)}
.search{display:flex;align-items:center;background:var(--card);border-radius:16px;padding:0 14px;border:1px solid var(--line)}.search input{width:100%;border:0;background:transparent;padding:13px;outline:0}
.filters{display:flex;gap:8px;overflow:auto;padding:12px 0}.filters button{border:0;border-radius:999px;padding:9px 12px;background:var(--oat);white-space:nowrap}.filters .active{background:var(--green);color:white}
.notice{background:#fff5d9;border:1px solid #ead5ab;border-radius:18px;padding:14px;margin:6px 0 14px;display:grid;gap:10px}.uid{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.uid code{background:white;padding:9px 10px;border-radius:10px;font-size:12px;overflow-wrap:anywhere;flex:1}.uid button{border:0;background:#8a6a2a;color:white;border-radius:10px;padding:9px 11px;font-weight:800}
.list{display:grid;gap:10px}.item{display:flex;gap:12px;background:var(--card);padding:14px;border-radius:20px;border:1px solid #ffffff;box-shadow:0 4px 18px #00000008}.item.done{opacity:.55}.check{width:27px;height:27px;border:2px solid #8b9a89;border-radius:9px;background:white;flex:0 0 auto}.item.done .check{background:var(--green);color:white;border-color:var(--green)}.body{flex:1;min-width:0}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.top h2{font-size:17px;margin:1px 0 5px}.pill{background:var(--sage);padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}.pill.warn{background:#f4dfbd}.desc,.meta{font-size:13px;color:var(--muted);margin:0}.meta{margin-top:6px}
.login{max-width:430px;margin:11vh auto 0;background:var(--card);padding:26px;border-radius:28px;box-shadow:0 18px 50px #00000012}.login h1{font-size:34px}.muted{color:var(--muted)}label{display:grid;gap:6px;margin:12px 0;font-weight:700}label input{border:1px solid var(--line);border-radius:13px;padding:12px;background:white}.primary,.secondary{width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;margin-top:8px}.primary{background:var(--green);color:white}.secondary{background:var(--sage);color:var(--ink)}.msg{margin-top:12px;font-size:13px;color:#775c27;background:#fff5d9;padding:10px;border-radius:12px}
.bottom{position:fixed;left:10px;right:10px;bottom:10px;max-width:740px;margin:auto;background:#fffdf8eF;backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:24px;padding:12px 10px;display:grid;grid-template-columns:repeat(5,1fr);text-align:center;font-size:12px;box-shadow:0 12px 30px #0002}.bottom b{color:var(--green)}.hidden{display:none}

<script>
const sb = supabase.createClient('https://bixdfvcgtxlsmkbnqbdu.supabase.co', 'sb_publishable_JLA2i8RvnwDLYCBr3owJqQ_VpjKlOKQ');
let rows=[], inventoryRows=[], preparedMealRows=[], reservationRows=[], portionRows=[], substitutionPrefs=[], mealSubstitutions=[], recipeRows=[], filter='all', query='', userId='', householdId='', msg='', smartSummary=null;

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function formatBuy(r){
  if(r.packages_to_buy && r.package_size && r.package_unit){
    if(r.packages_to_buy===1){
      if(['Stück','Knolle','Tube','Bund','Packung'].includes(r.package_unit)) return '1 '+r.package_unit;
      return Number(r.package_size).toLocaleString('de-DE')+' '+r.package_unit;
    }
    return r.packages_to_buy+' × '+Number(r.package_size).toLocaleString('de-DE')+' '+r.package_unit;
  }
  if(r.quantity_to_buy!=null && r.required_unit) return Number(r.quantity_to_buy).toLocaleString('de-DE')+' '+r.required_unit;
  return 'prüfen';
}
function reason(r){
  const inv=Number(r.covered_by_inventory||0), del=Number(r.covered_by_delivery||0), bought=Number(r.covered_by_purchased||0);
  if(r.category==='Vorrat prüfen') return 'Bestand noch nicht sicher bestätigt';
  if(inv>0 && bought>0 && del>0) return 'Vorrat + bereits gekauft + Lieferung berücksichtigt';
  if(inv>0 && bought>0) return 'Vorrat + bereits gekauft berücksichtigt';
  if(inv>0 && del>0) return 'Vorrat + Lieferung berücksichtigt';
  if(bought>0 && del>0) return 'Bereits gekauft + Lieferung berücksichtigt';
  if(inv>0) return 'Vorrat bereits reserviert';
  if(bought>0) return 'Bereits gekauft berücksichtigt';
  if(del>0) return 'Biokiste rechtzeitig berücksichtigt';
  return 'Für den Plan noch erforderlich';
}
function renderLogin(){
  document.getElementById('app').innerHTML=`<main class="shell"><section class="login">
  <div style="font-size:30px">🧺</div><h1>Kochen</h1><p class="muted">Einkaufsliste für euren Haushalt</p>
  <label>E-Mail<input id="email" type="email" autocomplete="email"></label>
  <label>Passwort<input id="password" type="password" minlength="6" autocomplete="current-password"></label>
  <button class="primary" onclick="login()">Anmelden</button>
  <button class="secondary" onclick="signup()">Konto anlegen</button>
  <div id="loginmsg" class="msg hidden"></div></section></main>`;
}
let activeTab='today';
let recipeOpen=null;
let cookMode=null;
let cookStep=0;
let cookServings=null;
let cookMultiplier=1;
let cookStateParked=false; // gespeicherter Kochstand vorhanden, aber nicht automatisch öffnen

const COOK_STATE_KEY='kochen_active_cook_v3';
try{
  const _oldCook=JSON.parse(localStorage.getItem(COOK_STATE_KEY)||'null');
  if(_oldCook && String(_oldCook.cookMode||'').toLowerCase().includes('haehnchen')) localStorage.removeItem(COOK_STATE_KEY);
}catch(e){}
function saveCookState(){
  try{
    if(!cookMode){localStorage.removeItem(COOK_STATE_KEY);return;}
    localStorage.setItem(COOK_STATE_KEY,JSON.stringify({
      cookMode,cookStep,cookServings,cookMultiplier,
      cookTimerSeconds,cookTimerEndAt,cookTimerRunning,cookPushTimerId,
      savedAt:Date.now()
    }));
  }catch(e){}
}
function clearCookState(){try{localStorage.removeItem(COOK_STATE_KEY);}catch(e){}}
function restoreCookState(){
  try{
    const raw=localStorage.getItem(COOK_STATE_KEY);
    if(!raw)return false;
    const s=JSON.parse(raw);
    if(!s?.cookMode || !tm6Cook[s.cookMode]){clearCookState();return false;}
    cookMode=s.cookMode;
    cookStep=Math.max(0,Math.min(Number(s.cookStep)||0,tm6Cook[cookMode].steps.length-1));
    cookServings=s.cookServings==null?(tm6Cook[cookMode].defaultYield||1):Number(s.cookServings);
    cookMultiplier=Number(s.cookMultiplier)||1;
    cookTimerSeconds=Math.max(0,Number(s.cookTimerSeconds)||0);
    cookTimerEndAt=s.cookTimerEndAt?Number(s.cookTimerEndAt):null;
    cookTimerRunning=!!s.cookTimerRunning && !!cookTimerEndAt;
    cookPushTimerId=s.cookPushTimerId||null;
    // Nach einem echten Reload nur den Stand wiederherstellen, nicht ungefragt den Kochmodus öffnen.
    // So bleibt z. B. 'Heute' sichtbar, während der Kochstand erhalten bleibt.
    cookStateParked=true;
    recipeOpen=null;
    return true;
  }catch(e){clearCookState();return false;}
}
function setCookStep(next){
  if(!cookMode)return;
  cookStateParked=false;
  cookStep=Math.max(0,Math.min(Number(next)||0,tm6Cook[cookMode].steps.length-1));
  saveCookState();
  renderCookMode();
}

function resumeCookMode(){
  if(!cookMode)return;
  cookStateParked=false;
  activeTab='recipes';
  recipeOpen=null;
  renderCookMode();
}
function parkCookMode(targetTab='today'){
  if(cookMode) saveCookState();
  cookStateParked=true;
  activeTab=targetTab;
  recipeOpen=null;
  renderApp();
}
function parkCookToRecipe(){
  if(cookMode) saveCookState();
  const key=cookMode;
  cookStateParked=true;
  activeTab='recipes';
  recipeOpen=key;
  renderRecipes();
}
function cookResumeCard(){
  if(!cookMode || !cookStateParked || !tm6Cook[cookMode]) return '';
  const c=tm6Cook[cookMode];
  const step=Math.max(0,Math.min(cookStep,c.steps.length-1));
  return `<section class="notice" style="margin-top:14px;background:#fff8e8;border-color:#ead39a">
    <div style="width:100%"><b>Kochmodus pausiert</b><br><span class="muted">${c.title} · Schritt ${step+1}/${c.steps.length} bleibt gespeichert.</span>
    <button onclick="resumeCookMode()" style="margin-top:10px;padding:10px 14px;border:0;border-radius:14px;background:#294936;color:white;font-weight:700">Kochmodus fortsetzen</button></div>
  </section>`;
}

function closeCookMode(){
  recipeOpen=cookMode;
  cookMode=null; cookStep=0; cookServings=null; cookMultiplier=1;
  clearCookState();
  renderRecipes();
}

function openRecipe(key){
  activeTab='recipes';
  recipeOpen=key;
  renderApp();
}


function prepCard(title,key,whenText){
  return `<article class="item" style="border-style:dashed">
    <div class="body">
      <div class="top">
        <h2>${key ? `<span onclick="openRecipe('${key}')" style="cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px">${title}</span>` : `<span>${title}</span>`}</h2>
        <span class="pill">Vorbereiten</span>
      </div>
      <div class="meta">${whenText}</div>
    </div>
  </article>`;
}


function recipeLink(title,key){
  if(key){
    return `<button type="button" onclick="event.stopPropagation();openRecipe('${key}')" style="display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid #cbd8cf;border-radius:12px;background:#f3f7f2;color:#183425;font:inherit;font-weight:800;cursor:pointer">${title}<span aria-hidden="true">›</span></button>`;
  }
  return `<span style="font-weight:700">${title}</span>`;
}


const nutritionTargets={
  user:{label:'Du',kcalMin:1700,kcalMax:1800,proteinMin:90},
  husband:{label:'Marcel',kcalMin:2200,kcalMax:2300,proteinMin:109}
};
const recipeMetrics={
  'Quark mit Beeren':{active:5,total:5},
  'Blumenkohlsuppe':{active:15,total:30},
  'Tomatensuppe':{active:12,total:35},
  'Genießer-Salat':{active:25,total:35},
  'Gebackener Feta auf Paprika-Tomaten':{active:15,total:40},
  'Hähnchen-Sesam-Salat':{active:25,total:45},
  'Auberginen-Hack-Auflauf':{active:25,total:55},
  'Rohkost-Salat mit Ei':{active:20,total:30},
  'Lachs mit scharfem Kohlrabi-Karotten-Gemüse':{active:25,total:40},
  'Sesam-Tofu auf buntem Salat':{active:25,total:35}
};
function plainRecipeTitle(html){const d=document.createElement('div');d.innerHTML=html||'';return (d.textContent||'').trim();}
function timeMetaFor(title){const t=recipeMetrics[title];return t?`${t.active} Min aktiv · ${t.total} Min gesamt`:'';}
function dayTimeSummary(day){
  let active=0,total=0,known=0;
  (day.meals||[]).forEach(m=>{const t=recipeMetrics[plainRecipeTitle(m[1])];if(t){active+=t.active;total+=t.total;known++;}});
  return known?{active,total,known}:null;
}
function targetCard(){
  return `<section class="notice" style="background:#edf3e9;border-color:#d7e2d0"><div><b>Tagesziele Erwachsene</b><br><span class="muted">Du: ${nutritionTargets.user.kcalMin}–${nutritionTargets.user.kcalMax} kcal · mind. ${nutritionTargets.user.proteinMin} g Protein<br>Marcel: ${nutritionTargets.husband.kcalMin}–${nutritionTargets.husband.kcalMax} kcal · mind. ${nutritionTargets.husband.proteinMin} g Protein</span></div></section>`;
}



// Nährwerte pro Kochbuchportion. Quelle: Kochbuchfotos; Quark = ca.-Angabe der Nutzerin.
// Zündersuppen bleiben absichtlich offen, weil das Kochbuch keine Nährwerte angibt.
const recipeNutrition={
  'Quark mit Beeren':{kcal:300,protein:26,carbs:null,source:'ca.'},
  'Genießer-Salat':{kcal:480,protein:38,carbs:17,source:'Kochbuch'},
  'Sesam-Tofu auf buntem Salat':{kcal:427,protein:24,carbs:27,source:'Kochbuch'},
  'Lachs mit scharfem Kohlrabi-Karotten-Gemüse':{kcal:434,protein:35,carbs:21,source:'Kochbuch'},
  'Hähnchen-Sesam-Salat':{kcal:489,protein:47,carbs:24,source:'Kochbuch'},
  'Hähnchen mit Sesamkruste auf Tomaten-Gurken-Salat':{kcal:489,protein:47,carbs:24,source:'Kochbuch'},
  'Auberginen-Hack-Auflauf':{kcal:486,protein:48,carbs:20,source:'Kochbuch'},
  'Gebackener Feta auf Paprika-Tomaten':{kcal:401,protein:36,carbs:25,source:'Kochbuch'},
  'Schlemmerfilet auf buntem Gemüse':{kcal:346,protein:38,carbs:17,source:'Kochbuch'},
  'Toast mit Schinken & Ei':{kcal:423,protein:25,carbs:39,source:'Kochbuch'},
  'Auberginen gefüllt mit Linsencurry':{kcal:521,protein:21,carbs:60,source:'Kochbuch'},
  'Geschmortes Rindfleisch chinesische Art':{kcal:538,protein:38,carbs:63,source:'Kochbuch'},
  'Jägerschnitzel mit Champignons':{kcal:401,protein:41,carbs:26,source:'Kochbuch'}
};

const recipeDefaultCooked={
  'Quark mit Beeren':2,
  'Genießer-Salat':4,
  'Sesam-Tofu auf buntem Salat':4,
  'Lachs mit scharfem Kohlrabi-Karotten-Gemüse':4,
  'Hähnchen-Sesam-Salat':4,
  'Auberginen-Hack-Auflauf':4,
  'Gebackener Feta auf Paprika-Tomaten':4,
  'Blumenkohlsuppe':5,
  'Tomatensuppe':null,
  'Schlemmerfilet auf buntem Gemüse':4,
  'Toast mit Schinken & Ei':1,
  'Auberginen gefüllt mit Linsencurry':1,
  'Geschmortes Rindfleisch chinesische Art':4,
  'Jägerschnitzel mit Champignons':4
};

function dayKeyFor(day){
  return Object.entries(weekPlan).find(([,v])=>v===day)?.[0]||null;
}
function mealTypeForLabel(label){
  const s=(label||'').toLowerCase();
  if(s.includes('frühstück'))return 'BREAKFAST';
  if(s.includes('mittag'))return 'LUNCH';
  return 'DINNER';
}
function mealKey(date,meal){
  return `${date}|${mealTypeForLabel(meal[0])}|${plainRecipeTitle(meal[1])}`;
}
function storedPortion(date,meal,person){
  const key=mealKey(date,meal);
  return portionRows.find(r=>`${r.meal_date}|${r.meal_type}|${r.recipe_title}`===key && r.person_key===person)?.planned_portions;
}
function suggestedAdultTotal(meal,cooked){
  const label=(meal[0]||'').toLowerCase();
  const meta=(meal[2]||'').toLowerCase();
  if(label.includes('frühstück') || label.includes('mittag') || meta.includes('2 erwachsene') || meta.includes('2 restportionen')) return Math.min(Number(cooked||2),2);
  return Math.min(Number(cooked||2.3),2.3);
}
function suggestedSplit(meal){
  const title=plainRecipeTitle(meal[1]);
  const cooked=recipeDefaultCooked[title] ?? 2;
  const adultTotal=suggestedAdultTotal(meal,cooked);
  const userMid=(nutritionTargets.user.kcalMin+nutritionTargets.user.kcalMax)/2;
  const marcelMid=(nutritionTargets.husband.kcalMin+nutritionTargets.husband.kcalMax)/2;
  const user=adultTotal*(userMid/(userMid+marcelMid));
  const marcel=adultTotal-user;
  return {cooked:Number(cooked),user:Number(user.toFixed(2)),marcel:Number(marcel.toFixed(2))};
}
function splitForMeal(date,meal){
  const s=suggestedSplit(meal);
  const u=storedPortion(date,meal,'user');
  const m=storedPortion(date,meal,'marcel');
  return {
    cooked:s.cooked,
    user:u==null?s.user:Number(u),
    marcel:m==null?s.marcel:Number(m),
    custom:u!=null||m!=null
  };
}
function splitMeta(date,meal){
  const s=splitForMeal(date,meal);
  const rest=Math.max(0,s.cooked-s.user-s.marcel);
  return `<div class="meta" style="margin-top:7px"><b>Aufteilen:</b> Du ${s.user.toLocaleString('de-DE')} Port. · Marcel ${s.marcel.toLocaleString('de-DE')} Port.${rest>0?` · ${rest.toLocaleString('de-DE')} Port. Familie/Rest`:''}${s.custom?' · angepasst':' · Vorschlag'}</div>`;
}
function openPortionSplit(date,index){
  const day=weekPlan[date], meal=day?.meals?.[index]; if(!meal)return;
  const title=plainRecipeTitle(meal[1]);
  const s=splitForMeal(date,meal);
  const n=recipeNutrition[title];
  const overlay=document.createElement('div');
  overlay.id='portionSplitEditor';
  overlay.style='position:fixed;inset:0;background:rgba(20,30,24,.42);z-index:9999;display:flex;align-items:flex-end;justify-content:center;padding:12px';
  overlay.innerHTML=`<section style="width:min(620px,100%);background:#fffdf7;border-radius:26px 26px 18px 18px;padding:20px;max-height:92vh;overflow:auto">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
      <div><div class="eyebrow">SO AUFTEILEN</div><h2 style="margin:4px 0 0">${esc(title)}</h2></div>
      <button class="icon" onclick="document.getElementById('portionSplitEditor')?.remove()">×</button>
    </div>
    <div class="notice" style="margin-top:14px;background:#edf3e9;border-color:#d7e2d0">
      <div><b>Vorschlag aus euren Tageszielen</b><br><span class="muted">Du und Marcel werden getrennt gerechnet. Kinder/Familienrest bleiben außerhalb eures Ernährungschecks.</span></div>
    </div>
    <label style="display:block;margin-top:14px">Gekocht / zubereitet
      <input id="splitCooked" type="number" min="0" step="0.1" value="${s.cooked}" style="width:100%" oninput="updateSplitPreview('${date}',${index})">
    </label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
      <label>Du
        <input id="splitUser" type="number" min="0" step="0.05" value="${s.user}" style="width:100%" oninput="updateSplitPreview('${date}',${index})">
      </label>
      <label>Marcel
        <input id="splitMarcel" type="number" min="0" step="0.05" value="${s.marcel}" style="width:100%" oninput="updateSplitPreview('${date}',${index})">
      </label>
    </div>
    <div id="splitPreview" class="notice" style="margin-top:14px"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="secondary" style="flex:1" onclick="resetPortionSplit('${date}',${index})">Vorschlag</button>
      <button class="primary" style="flex:1.4" onclick="savePortionSplit('${date}',${index})">Speichern</button>
    </div>
  </section>`;
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});
  document.body.appendChild(overlay);
  updateSplitPreview(date,index);
}
function updateSplitPreview(date,index){
  const meal=weekPlan[date]?.meals?.[index]; if(!meal)return;
  const title=plainRecipeTitle(meal[1]), n=recipeNutrition[title];
  const cooked=Number(document.getElementById('splitCooked')?.value||0);
  const u=Number(document.getElementById('splitUser')?.value||0);
  const m=Number(document.getElementById('splitMarcel')?.value||0);
  const rest=cooked-u-m;

function nutritionForDay(day){
  const date=dayKeyFor(day);
  const result={
    user:{kcal:0,protein:0,carbs:0,carbsKnown:true},
    husband:{kcal:0,protein:0,carbs:0,carbsKnown:true},
    missing:[]
  };
  (day.meals||[]).forEach(meal=>{
    const title=plainRecipeTitle(meal[1]), n=recipeNutrition[title];
    if(!n){result.missing.push(title);return;}
    const split=splitForMeal(date,meal);
    for(const [person,portions] of [['user',split.user],['husband',split.marcel]]){
      result[person].kcal+=n.kcal*portions;
      result[person].protein+=n.protein*portions;
      if(n.carbs==null)result[person].carbsKnown=false;
      else result[person].carbs+=n.carbs*portions;
    }
  });
  result.missing=[...new Set(result.missing)];
  return result;
}
function nutritionStatus(personKey,x){
  const t=nutritionTargets[personKey];
  const kcalOk=x.kcal>=t.kcalMin && x.kcal<=t.kcalMax;
  const proteinOk=x.protein>=t.proteinMin;
  return {kcalOk,proteinOk,ok:kcalOk&&proteinOk};
}
function nutritionCheckCard(day){
  const n=nutritionForDay(day);
  const u=nutritionStatus('user',n.user), m=nutritionStatus('husband',n.husband);
  const incomplete=n.missing.length>0;
  const line=(key,x,s)=>{
    const t=nutritionTargets[key], label=t.label;
    const kcalTxt=`${Math.round(x.kcal)} / ${t.kcalMin}–${t.kcalMax} kcal`;
    const protTxt=`${Math.round(x.protein)} / ≥${t.proteinMin} g Protein`;
    const carbTxt=key==='husband'?(x.carbsKnown?` · ${Math.round(x.carbs)} g KH`:' · KH teilweise offen'):'';
    return `<div style="margin-top:8px"><b>${label}</b><br><span class="muted">${kcalTxt} ${s.kcalOk?'✓':'⚠'} · ${protTxt} ${s.proteinOk?'✓':'⚠'}${carbTxt}</span></div>`;
  };
  return `<section class="notice" style="margin-top:14px;background:${incomplete?'#fff8e8':(u.ok&&m.ok?'#edf3e9':'#fff8e8')};border-color:${incomplete?'#ead39a':'#d7e2d0'}">
    <div><b>Ernährungscheck ${incomplete?'· teilweise offen':(u.ok&&m.ok?'✓':'· Anpassung nötig')}</b>
      ${line('user',n.user,u)}
      ${line('husband',n.husband,m)}
      ${incomplete?`<div class="meta" style="margin-top:8px">Noch ohne verlässliche Nährwerte: ${n.missing.join(', ')}. Diese Mahlzeiten sind in den Summen noch nicht enthalten.</div>`:''}
      <div class="meta" style="margin-top:8px">Die Werte verwenden jetzt eure Aufteilung je Mahlzeit. Tippe bei einem Gericht auf „So aufteilen“, um sie anzupassen.</div>
    </div>
  </section>`;
}
function nutritionBadge(title){
  const n=recipeNutrition[title];
  if(!n)return '';
  return `${n.source==='ca.'?'ca. ':''}${n.kcal} kcal · ${n.protein} g Protein${n.carbs!=null?` · ${n.carbs} g KH`:''}`;
}

    if(est.length) bits.push(`${est.length} geschätzte Vorräte wurden als Verbrauch protokolliert`);

function niceAmount(n){
  if(!Number.isFinite(n)) return '';
  const rounded=Math.round(n*100)/100;
  const whole=Math.floor(rounded);
  const frac=Math.round((rounded-whole)*100)/100;
  const fractions=[
    [0.25,'¼'],[0.33,'⅓'],[0.5,'½'],[0.67,'⅔'],[0.75,'¾']
  ];
  const hit=fractions.find(([v])=>Math.abs(frac-v)<0.02);
  if(hit){
    if(whole===0) return hit[1];
    return `${whole} ${hit[1]}`;
  }
  return rounded.toLocaleString('de-DE',{maximumFractionDigits:2});
}

function scaleNumberToken(raw,factor){
  const n=Number(String(raw).replace(',','.'));
  return Number.isFinite(n)?niceAmount(n*factor):raw;
}

function scaleNeedLine(line,factor){
  if(!factor || Math.abs(factor-1)<0.0001) return line;

  // Mengen mit Küchen-/Gewichtseinheit, egal ob am Anfang oder mitten im Satz.
  let out=line.replace(/(\d+(?:[.,]\d+)?)\s*(kg|g|ml|l|EL|TL)\b/gi,
    (_,num,unit)=>`${scaleNumberToken(num,factor)} ${unit}`);

  // Stückangaben / zählbare Zutaten, die in den Kochschritten vorkommen.
  const countWords='Eier?|Paprika|Tomaten?|Gurken?|Zwiebeln?|Pastinaken?|Blumenkohl|Schalotten?|Radieschen|Knoblauchzehen?|Feta|Schafskäse|Chicorée|Orangen?|Champignons?|Pilze?|Kartoffeln?|Möhren?|Karotten?|Kohlrabi|Auberginen?|Frühlingszwiebeln?';
  // Erlaubt Adjektive zwischen Zahl und Zutat, z. B. „3 rote Paprika“ oder „1 große Zwiebel“.
  const re=new RegExp(`\\b(\\d+(?:[.,]\\d+)?)(\\s+(?:(?!${countWords}\\b)[A-Za-zÄÖÜäöüß-]+\\s+){0,3})(${countWords})\\b`,'gi');
  out=out.replace(re,(_,num,middle,word)=>`${scaleNumberToken(num,factor)}${middle}${word}`);

  return out;
}

function scaleInstructionText(line,factor){
  if(!factor || Math.abs(factor-1)<0.0001) return line;

  // Nur Zutatenmengen skalieren – niemals Zeiten, Temperaturen oder TM6-Stufen.
  let out=line.replace(/(\d+(?:[.,]\d+)?)\s*(kg|g|ml|l|EL|TL)\b/gi,
    (_,num,unit)=>`${scaleNumberToken(num,factor)} ${unit}`);

  const countWords='Eier?|Paprika|Tomaten?|Gurken?|Zwiebeln?|Pastinaken?|Blumenkohl|Schalotten?|Radieschen|Knoblauchzehen?|Feta|Schafskäse|Chicorée|Orangen?|Champignons?|Pilze?|Kartoffeln?|Möhren?|Karotten?|Kohlrabi|Auberginen?|Frühlingszwiebeln?';
  // Erlaubt Adjektive zwischen Zahl und Zutat, z. B. „3 rote Paprika“ oder „1 große Zwiebel“.
  const re=new RegExp(`\\b(\\d+(?:[.,]\\d+)?)(\\s+(?:(?!${countWords}\\b)[A-Za-zÄÖÜäöüß-]+\\s+){0,3})(${countWords})\\b`,'gi');
  out=out.replace(re,(_,num,middle,word)=>`${scaleNumberToken(num,factor)}${middle}${word}`);
  return out;
}

function urlBase64ToUint8Array(base64String){

  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

function formatCookTimer(seconds){

  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return h>0
    ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
    : `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function secondsFromStepSetting(setting){
  if(!setting) return null;
  let total=0, found=false;
  const h=setting.match(/(\d+(?:[.,]\d+)?)\s*Std/i);
  const m=setting.match(/(\d+(?:[.,]\d+)?)\s*Min/i);
  const s=setting.match(/(\d+(?:[.,]\d+)?)\s*Sek/i);
  if(h){total+=Number(h[1].replace(',','.'))*3600;found=true;}
  if(m){total+=Number(m[1].replace(',','.'))*60;found=true;}
  if(s){total+=Number(s[1].replace(',','.'));found=true;}
  return found?Math.round(total):null;
}

function dbRecipeSource(r){
  const src=Array.isArray(r?.recipe_original_sources)?r.recipe_original_sources[0]:r?.recipe_original_sources;
  return src||{};
}
function recipePageLabel(r){ return r?.source_page?`Kochbuch S. ${esc(String(r.source_page))}`:'Kochbuch'; }
function recipeServingLabel(r){
  const n=Number(r?.original_servings||0);
  return n?`${n.toLocaleString('de-DE',{maximumFractionDigits:1})} ${n===1?'Portion':'Portionen'}`:'Portionszahl nicht angegeben';
}
function recipeTimeInfo(r){
  const src=dbRecipeSource(r);
  const steps=src?.original_steps||[];
  let min=0,max=0,found=false;
  for(const st of steps){
    const text=String(st?.instruction||st||'');
    const rx=/(\d+)\s*(?:[-–]\s*(\d+)\s*)?(Minuten?|Min\.?|Stunden?|Std\.?)/gi;
    let m;
    while((m=rx.exec(text))){
      let a=Number(m[1]), b=Number(m[2]||m[1]);
      const unit=(m[3]||'').toLowerCase();
      if(unit.startsWith('st')){ a*=60; b*=60; }
      min+=a; max+=b; found=true;
    }
  }
  if(!found) return {label:'Keine Zeitangabe im Original',minutes:null};
  const fmt=v=>v>=60?`${Math.floor(v/60)} Std.${v%60?` ${v%60} Min.`:''}`:`${v} Min.`;
  return {label:min===max?`mind. ${fmt(min)} laut Rezeptschritten`:`mind. ${fmt(min)}–${fmt(max)} laut Rezeptschritten`,minutes:min};
}

function recipeSearchText(r){
  const src=dbRecipeSource(r);
  return [r?.title,r?.phase,r?.source_page,r?.notes,src?.gluten_free_adaptation,...(src?.original_ingredients||[])].filter(Boolean).join(' ').toLowerCase();
}
let recipeListQuery='';
function setRecipeListQuery(v){

function legacyRecipeKeyFor(db){
  return Object.keys(recipeData||{}).find(k=>recipeData[k]?.title===db?.title) || null;
}
function verifiedTm6KeyFor(db){
  const k=legacyRecipeKeyFor(db);
  return k && tm6Cook?.[k] ? k : null;
}
function originalStepText(db){
  const src=dbRecipeSource(db);
  return (src.original_steps||[]).map(x=>x?.instruction||String(x||'')).join(' ');
}
function airfryerSuitability(db){
  const t=originalStepText(db);
  const low=t.toLowerCase();
  // Nur dann anbieten, wenn das Original eine trockene Hitzequelle oder knuspriges Braten explizit vorsieht.
  const suitable=/(backofen|ofen|backen|grill|grillen|überback|knuspr|braten|anbraten|pfanne)/i.test(t);
  if(!suitable) return null;
  const temp=[...t.matchAll(/(1[4-9]0|2[0-3]0)\s*°?\s*c/gi)].map(m=>Number(m[1]));
  const times=[...t.matchAll(/(\d{1,3})(?:\s*[–-]\s*(\d{1,3}))?\s*(?:min\.?|minuten)/gi)].map(m=>[Number(m[1]),m[2]?Number(m[2]):Number(m[1])]);
  return {
    sourceTemp: temp.length?temp[0]:null,
    sourceTime: times.length?times[0]:null,
    basis: /(backofen|ofen|backen|grill|grillen|überback)/i.test(t)?'Ofen-/Grillschritt im Original':'Brat-/Knusperschritt im Original'
  };
}
function airfryerAdaptationText(db){
  const a=airfryerSuitability(db);
  if(!a) return '';
  let parts=[];
  if(a.sourceTemp){
    const af=Math.max(140,a.sourceTemp-20);
    parts.push(`Startwert: ${af} °C Heißluftfritteuse (vom Original-Ofenwert ${a.sourceTemp} °C abgeleitet)`);
  } else {
    parts.push('Temperatur nicht aus dem Original ableitbar – deshalb kein fixer Temperaturwert');
  }
  if(a.sourceTime){
    const lo=Math.max(3,Math.round(a.sourceTime[0]*0.7));
    const hi=Math.max(lo,Math.round(a.sourceTime[1]*0.8));
    parts.push(`ab ca. ${lo}${hi!==lo?'–'+hi:''} Min. prüfen; nur weitergaren, bis der im Original beschriebene Gar-/Bräunungsgrad erreicht ist`);
  } else {
    parts.push('Garzeit im Original nicht eindeutig angegeben – frühzeitig kontrollieren und nach Sicht garen');
  }
  parts.push('Korb nicht überfüllen; bei Stücken einmal wenden bzw. schütteln');
  return parts.join(' · ');
}

function confirmOriginalCookStart(id){
  const db=recipeRows.find(x=>x.id===id);
  if(!db) return;
  const original=Number(db.original_servings||0);
  if(original){
    const n=Number(document.getElementById('originalCookServingsInput')?.value||original);
    if(!Number.isFinite(n)||n<=0){alert('Bitte eine gültige Portionszahl eingeben.');return;}
    originalCookServings=n;
    originalCookMultiplier=n/original;
  }else{
    originalCookServings=null;
    originalCookMultiplier=1;
  }
  originalCookToken=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random());
  document.getElementById('originalPortionStart')?.remove();
  originalCookRecipeId=id;
  originalCookStep=0;
  renderOriginalCookMode();
}
function setOriginalCookStep(n){
  const db=recipeRows.find(x=>x.id===originalCookRecipeId);
  const steps=db?dbRecipeSource(db)?.original_steps||[]:[];
  originalCookStep=Math.max(0,Math.min(n,steps.length-1));
  renderOriginalCookMode();
}

  const id=originalCookRecipeId;

async function finishOriginalCook(){
  const db=recipeRows.find(x=>x.id===originalCookRecipeId);
  if(!db) return exitOriginalCook();
  const original=Number(db.original_servings||0);
  const defaultYield=originalCookServings ?? (original||'');
  let y=prompt('Wie viele Teller/Portionen hat die Kochrunde tatsächlich ergeben?',defaultYield);
  if(y===null) return;
  let p=prompt('Wie viele Portionen bleiben nach dem Essen übrig? Diese werden als fertige Mahlzeit gespeichert.','0');
  if(p===null) return;
  const yieldValue=y.trim()===''?null:Number(y.replace(',','.'));
  const remainValue=p.trim()===''?null:Number(p.replace(',','.'));
  if(yieldValue!==null && (!Number.isFinite(yieldValue)||yieldValue<0)){alert('Bitte eine gültige Portionszahl für die Ausbeute eingeben.');return;}
  if(remainValue!==null && (!Number.isFinite(remainValue)||remainValue<0)){alert('Bitte eine gültige Restmenge eingeben.');return;}

  const token=originalCookToken||(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random());
  const {error}=await sb.rpc('consume_recipe_v2',{
    p_recipe_id:db.id,
    p_cook_token:token,
    p_multiplier:originalCookMultiplier||1,
    p_yield_portions:yieldValue,
    p_portions_remaining:remainValue,
    p_excluded_food_ids:[]
  });
  if(error){
    alert('Die Kochrunde wurde nicht im Vorrat verbucht: '+error.message);
    return;
  }
  await loadInventory();
  const id=originalCookRecipeId;
  originalCookRecipeId=null; originalCookStep=0; originalCookServings=null; originalCookMultiplier=1; originalCookToken=null;
  recipeOpen=id; activeTab='recipes'; renderRecipes();
  alert('Kochrunde gespeichert. Vorrat und übrige Portionen wurden aktualisiert.');
}

function substitutionSuggestionForShopping(r){
  if(r.checked || r.category==='Vorrat prüfen' || Number(r.quantity_to_buy||0)<=0) return null;
  const pref=substitutionPrefs.find(p=>p.required_food_id===r.food_id && p.requires_confirmation);
  if(!pref)return null;
  const needed=Number(r.quantity_to_buy||0)*Number(pref.ratio||1);
  const candidates=inventoryRows.filter(x=>x.food_id===pref.substitute_food_id && unitSimple(x.unit)===unitSimple(r.required_unit) && Number(x.quantity||0)>0);
  const available=candidates.reduce((s,x)=>s+Number(x.quantity||0),0);
  if(available+1e-9<needed)return null;
  const foodName=pref.substitute_food?.name||'Alternative aus dem Vorrat';
  const already=mealSubstitutions.find(x=>x.required_food_id===r.food_id && x.substitute_food_id===pref.substitute_food_id && x.meal_date===r.needed_by && x.status==='planned');
  return {pref,needed,available,foodName,already};
}
async function acceptShoppingSubstitution(shoppingId){
  const r=rows.find(x=>x.id===shoppingId); if(!r)return;
  const s=substitutionSuggestionForShopping(r); if(!s)return;
  const recipeTitle=(r.foods?.name==='Rote Paprika' && r.needed_by==='2026-09-01')?'Gebackener Feta auf Paprika-Tomaten':'Geplante Mahlzeit';
  const payload={
    household_id:householdId,meal_date:r.needed_by,recipe_title:recipeTitle,
    required_food_id:r.food_id,substitute_food_id:s.pref.substitute_food_id,
    required_quantity:Number(r.quantity_to_buy),substitute_quantity:s.needed,
    unit:r.required_unit,status:'planned',
    note:'Vom Nutzer als Vorratsalternative bestätigt; Originalrezept bleibt unverändert.',
    updated_at:new Date().toISOString()
  };
  const {data,error}=await sb.from('meal_ingredient_substitutions').upsert(payload,{onConflict:'household_id,meal_date,recipe_title,required_food_id,substitute_food_id'}).select();
  if(error){alert('Alternative konnte nicht gespeichert werden: '+error.message);return;}
  mealSubstitutions=mealSubstitutions.filter(x=>!(x.required_food_id===r.food_id&&x.substitute_food_id===s.pref.substitute_food_id&&x.meal_date===r.needed_by));
  mealSubstitutions.push(...(data||[]));
  // Der heutige Einkaufsposten ist durch die bestätigte Alternative abgedeckt.
  const {error:e2}=await sb.from('shopping_items').update({checked:true}).eq('id',r.id);
  if(e2){alert('Alternative gespeichert, Einkaufsposten konnte aber nicht ausgeblendet werden: '+e2.message);return;}
  r.checked=true;
  msg=`Alternative bestätigt: ${s.needed.toLocaleString('de-DE')} ${r.required_unit} ${s.foodName} statt fehlender ${r.foods?.name||'Zutat'}.`;
  renderShopping();
}

function shoppingDayForNeededBy(neededBy){
  if(!neededBy) return null;
  const d=new Date(neededBy+'T12:00:00');
  if(Number.isNaN(d.getTime())) return null;
  const dow=d.getDay(); // So=0 ... Di=2 ... Fr=5
  let back=0;
  if(dow===2) back=0;       // Dienstag: Einkauf am selben Tag
  else if(dow===3) back=1;  // Mittwoch: Dienstag
  else if(dow===4) back=2;  // Donnerstag: Dienstag
  else if(dow===5) back=0;  // Freitag: Einkauf am selben Tag
  else if(dow===6) back=1;  // Samstag: Freitag
  else if(dow===0) back=2;  // Sonntag: Freitag
  else if(dow===1) back=3;  // Montag: Freitag
  const x=new Date(d); x.setDate(x.getDate()-back);
  return x.toLocaleDateString('en-CA');
}
function shoppingDayLabel(day){
  if(!day) return 'Ohne festen Einkaufstag';
  const d=new Date(day+'T12:00:00');
  const dow=d.getDay();
  const prefix=dow===5?'Freitagseinkauf':'Dienstagseinkauf';
  const coverage=dow===5?'deckt Freitag bis Montag':'deckt Dienstag bis Donnerstag';
  return `${prefix} · ${d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})} · ${coverage}`;
}

function reservationForInventory(r){
  const u=unitSimple(r.unit);
  return reservationRows
    .filter(x=>x.food_id===r.food_id && unitSimple(x.unit)===u)
    .reduce((sum,x)=>sum+Number(x.reserved_inventory||0),0);
}
function totalKnownForPool(r){
  const u=unitSimple(r.unit);
  return inventoryRows
    .filter(x=>x.food_id===r.food_id && x.quantity_status==='known' && unitSimple(x.unit)===u)
    .reduce((sum,x)=>sum+Number(x.quantity||0),0);
}
function firstPoolRow(r){
  const u=unitSimple(r.unit);
  return inventoryRows.find(x=>x.food_id===r.food_id && unitSimple(x.unit)===u)?.id===r.id;
}
function smartInventoryMeta(r){
  if(r.quantity_status!=='known' || r.quantity==null || !firstPoolRow(r)) return '';
  const reserved=reservationForInventory(r);
  if(reserved<=0)return '';
  const total=totalKnownForPool(r);
  const free=Math.max(0,total-reserved);
  return `<div class="meta" style="margin-top:5px"><b>Plan:</b> ${reserved.toLocaleString('de-DE')} ${esc(r.unit||'')} reserviert · ${free.toLocaleString('de-DE')} ${esc(r.unit||'')} frei</div>`;
}

async function saveInventoryEditor(){
  const qtyRaw=document.getElementById('invQty').value;
  const qty=qtyRaw===''?null:Number(qtyRaw);
  const unit=document.getElementById('invUnit').value.trim();
  const location=document.getElementById('invLoc').value.trim()||'Ohne Ort';
  const quantity_status=document.getElementById('invStatus').value;
  const opened=document.getElementById('invOpened').checked;

  if(qty!==null && (Number.isNaN(qty)||qty<0)){alert('Bitte eine gültige Menge eingeben.');return;}

  let foodId;
  if(inventoryEditId){
    foodId=document.getElementById('invFoodId').value;
  }else{
    const name=document.getElementById('invFoodName').value.trim();
    if(!name){alert('Bitte ein Lebensmittel auswählen oder eingeben.');return;}
    let food=foodOptions.find(f=>f.name.toLowerCase()===name.toLowerCase());
    if(!food){
      const {data,error}=await sb.from('foods').insert({name,default_unit:unit||null}).select('id,name,default_unit').single();
      if(error){alert('Lebensmittel konnte nicht angelegt werden: '+error.message);return;}
      food=data;
      foodOptions.push(food);
    }
    foodId=food.id;
  }

  let error;
  if(inventoryEditId){
    ({error}=await sb.from('inventory_items').update({
      quantity:qty,unit:unit||null,location,quantity_status,opened,last_checked_at:new Date().toISOString()
    }).eq('id',inventoryEditId).eq('household_id',householdId));
  }else{
    const existing=inventoryRows.find(r=>r.food_id===foodId && (r.location||'')===location);
    if(existing){
      ({error}=await sb.from('inventory_items').update({
        quantity:qty,unit:unit||null,quantity_status,opened,last_checked_at:new Date().toISOString()
      }).eq('id',existing.id).eq('household_id',householdId));
    }else{
      ({error}=await sb.from('inventory_items').insert({
        household_id:householdId,food_id:foodId,quantity:qty,unit:unit||null,location,quantity_status,opened,last_checked_at:new Date().toISOString()
      }));
    }
  }
  if(error){alert('Bestand konnte nicht gespeichert werden: '+error.message);return;}

  await refreshSmartShopping(false);
  closeInventoryEditor();
  inventoryEditId=null;
  await loadInventory();
}

function unitSimple(u){
  return (u||'').toLowerCase().trim()
    .replace('stück','st').replace('stck','st').replace('stk','st')
    .replace('gramm','g').replace('kilogramm','kg')
    .replace('milliliter','ml').replace('liter','l');
}

async function recalcShoppingForFood(foodId,qty,unit,status){
  if(status!=='known' || qty===null) return;
  const {data:items,error}=await sb.from('shopping_items')
    .select('id,required_quantity,required_unit,covered_by_delivery,package_size,packages_to_buy,checked')
    .eq('household_id',householdId).eq('food_id',foodId);
  if(error || !items?.length) return;

  for(const item of items){
    if(unitSimple(item.required_unit)!==unitSimple(unit)) continue;
    const required=Number(item.required_quantity||0);
    const delivery=Number(item.covered_by_delivery||0);
    const covered=Math.min(Number(qty||0),required);
    const toBuy=Math.max(0,required-covered-delivery);
    const pack=Number(item.package_size||0);
    const packages=pack>0?Math.ceil(toBuy/pack):(toBuy>0?1:0);
    await sb.from('shopping_items').update({
      covered_by_inventory:covered,
      quantity_to_buy:toBuy,
      packages_to_buy:packages,
      checked:toBuy===0 ? true : item.checked
    }).eq('id',item.id);
  }
}

    .select('id,title,phase,source_page,original_servings,notes,recipe_original_sources(original_ingredients,original_steps,gluten_free_adaptation,source_capture)')
    .eq('household_id',householdId)
    .order('source_page',{ascending:true});
  recipeRows=recipeLoadError?[]:(recipeDataRows||[]);
  if(recipeLoadError) msg='Rezepte konnten nicht geladen werden: '+recipeLoadError.message;

  const {data,error}=await sb
    .from('shopping_items')
    .select('id,household_id,food_id,required_quantity,required_unit,covered_by_inventory,covered_by_delivery,covered_by_purchased,quantity_to_buy,package_size,package_unit,packages_to_buy,category,checked,manually_added,auto_generated,needed_by,foods(name)')
    .eq('household_id',householdId)
    .order('needed_by',{ascending:true});

  if(error){
    msg='Einkaufsliste konnte nicht geladen werden: '+error.message;
    rows=[];
  } else {
    rows=data||[];
    if(!rows.length) msg='Haushalt erkannt – aktuell sind keine Einkaufsposten vorhanden.';
  }
  renderApp();
}
sb.auth.getSession().then(async ({data})=>{if(data.session){userId=data.session.user.id;await loadRows();restoreCookState();refreshCookPushState();renderApp()}else renderLogin()});
sb.auth.onAuthStateChange((_e,session)=>{if(session){userId=session.user.id;setTimeout(loadRows,0)}else{rows=[];householdId='';userId='';renderLogin()}});
</script>
</body></html>
