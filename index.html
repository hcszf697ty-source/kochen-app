function formatBuy(r){
  if(r.packages_to_buy && r.package_size && r.package_unit){
    if(r.packages_to_buy===1){
      if(['Stück','Knolle','Tube','Bund','Packung'].includes(r.package_unit)) return '1 '+r.package_unit;
      return Number(r.package_size).toLocaleString('de-DE')+' '+r.package_unit;
    }
    return r.packages_to_buy+' × '+Number(r.package_size).toLocaleString('de-DE')+' '+r.package_unit;
  }
  if(r.quantity_to_buy!=null && r.required_unit) return Number(r.quantity_to_buy).toLocaleString('de-DE')+' '+r.required_unit;
  return 'prüfen';
}
function reason(r){
  const inv=Number(r.covered_by_inventory||0), del=Number(r.covered_by_delivery||0), bought=Number(r.covered_by_purchased||0);
  if(r.category==='Vorrat prüfen') return 'Bestand noch nicht sicher bestätigt';
  if(inv>0 && bought>0 && del>0) return 'Vorrat + bereits gekauft + Lieferung berücksichtigt';
  if(inv>0 && bought>0) return 'Vorrat + bereits gekauft berücksichtigt';
  if(inv>0 && del>0) return 'Vorrat + Lieferung berücksichtigt';
  if(bought>0 && del>0) return 'Bereits gekauft + Lieferung berücksichtigt';
  if(inv>0) return 'Vorrat bereits reserviert';
  if(bought>0) return 'Bereits gekauft berücksichtigt';
  if(del>0) return 'Biokiste rechtzeitig berücksichtigt';
  return 'Für den Plan noch erforderlich';
}

function plainRecipeTitle(html){const d=document.createElement('div');d.innerHTML=html||'';return (d.textContent||'').trim();}
function timeMetaFor(title){const t=recipeMetrics[title];return t?`${t.active} Min aktiv · ${t.total} Min gesamt`:'';}

  'Quark mit Beeren':2,
  'Genießer-Salat':4,

function dayKeyFor(day){
  return Object.entries(weekPlan).find(([,v])=>v===day)?.[0]||null;
}
function mealTypeForLabel(label){
  const s=(label||'').toLowerCase();
  if(s.includes('frühstück'))return 'BREAKFAST';
  if(s.includes('mittag'))return 'LUNCH';
  return 'DINNER';
}
function mealKey(date,meal){
  return `${date}|${mealTypeForLabel(meal[0])}|${plainRecipeTitle(meal[1])}`;
}
function storedPortion(date,meal,person){
  const key=mealKey(date,meal);
  return portionRows.find(r=>`${r.meal_date}|${r.meal_type}|${r.recipe_title}`===key && r.person_key===person)?.planned_portions;
}
function suggestedAdultTotal(meal,cooked){
  const label=(meal[0]||'').toLowerCase();
  const meta=(meal[2]||'').toLowerCase();
  if(label.includes('frühstück') || label.includes('mittag') || meta.includes('2 erwachsene') || meta.includes('2 restportionen')) return Math.min(Number(cooked||2),2);
  return Math.min(Number(cooked||2.3),2.3);
}
function suggestedSplit(meal){
  const title=plainRecipeTitle(meal[1]);
  const cooked=recipeDefaultCooked[title] ?? 2;
  const adultTotal=suggestedAdultTotal(meal,cooked);
  const userMid=(nutritionTargets.user.kcalMin+nutritionTargets.user.kcalMax)/2;
  const marcelMid=(nutritionTargets.husband.kcalMin+nutritionTargets.husband.kcalMax)/2;
  const user=adultTotal*(userMid/(userMid+marcelMid));
  const marcel=adultTotal-user;
  return {cooked:Number(cooked),user:Number(user.toFixed(2)),marcel:Number(marcel.toFixed(2))};
}
function splitForMeal(date,meal){
  const s=suggestedSplit(meal);
  const u=storedPortion(date,meal,'user');
  const m=storedPortion(date,meal,'marcel');
  return {
    cooked:s.cooked,
    user:u==null?s.user:Number(u),
    marcel:m==null?s.marcel:Number(m),
    custom:u!=null||m!=null
  };
}
function splitMeta(date,meal){
  const s=splitForMeal(date,meal);
  const rest=Math.max(0,s.cooked-s.user-s.marcel);
  return `<div class="meta" style="margin-top:7px"><b>Aufteilen:</b> Du ${s.user.toLocaleString('de-DE')} Port. · Marcel ${s.marcel.toLocaleString('de-DE')} Port.${rest>0?` · ${rest.toLocaleString('de-DE')} Port. Familie/Rest`:''}${s.custom?' · angepasst':' · Vorschlag'}</div>`;
}
function openPortionSplit(date,index){
  const day=weekPlan[date], meal=day?.meals?.[index]; if(!meal)return;
  const title=plainRecipeTitle(meal[1]);
  const s=splitForMeal(date,meal);
  const n=recipeNutrition[title];
  const overlay=document.createElement('div');
  overlay.id='portionSplitEditor';
  overlay.style='position:fixed;inset:0;background:rgba(20,30,24,.42);z-index:9999;display:flex;align-items:flex-end;justify-content:center;padding:12px';
  overlay.innerHTML=`<section style="width:min(620px,100%);background:#fffdf7;border-radius:26px 26px 18px 18px;padding:20px;max-height:92vh;overflow:auto">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
      <div><div class="eyebrow">SO AUFTEILEN</div><h2 style="margin:4px 0 0">${esc(title)}</h2></div>
      <button class="icon" onclick="document.getElementById('portionSplitEditor')?.remove()">×</button>
    </div>
    <div class="notice" style="margin-top:14px;background:#edf3e9;border-color:#d7e2d0">
      <div><b>Vorschlag aus euren Tageszielen</b><br><span class="muted">Du und Marcel werden getrennt gerechnet. Kinder/Familienrest bleiben außerhalb eures Ernährungschecks.</span></div>
    </div>
    <label style="display:block;margin-top:14px">Gekocht / zubereitet
      <input id="splitCooked" type="number" min="0" step="0.1" value="${s.cooked}" style="width:100%" oninput="updateSplitPreview('${date}',${index})">
    </label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
      <label>Du
        <input id="splitUser" type="number" min="0" step="0.05" value="${s.user}" style="width:100%" oninput="updateSplitPreview('${date}',${index})">
      </label>
      <label>Marcel
        <input id="splitMarcel" type="number" min="0" step="0.05" value="${s.marcel}" style="width:100%" oninput="updateSplitPreview('${date}',${index})">
      </label>
    </div>
    <div id="splitPreview" class="notice" style="margin-top:14px"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="secondary" style="flex:1" onclick="resetPortionSplit('${date}',${index})">Vorschlag</button>
      <button class="primary" style="flex:1.4" onclick="savePortionSplit('${date}',${index})">Speichern</button>
    </div>
  </section>`;
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});
  document.body.appendChild(overlay);
  updateSplitPreview(date,index);
}
function updateSplitPreview(date,index){
  const meal=weekPlan[date]?.meals?.[index]; if(!meal)return;
  const title=plainRecipeTitle(meal[1]), n=recipeNutrition[title];
  const cooked=Number(document.getElementById('splitCooked')?.value||0);
  const u=Number(document.getElementById('splitUser')?.value||0);
  const m=Number(document.getElementById('splitMarcel')?.value||0);
  const rest=cooked-u-m;
  const nutrient=(p)=>n?`${Math.round(n.kcal*p)} kcal · ${Math.round(n.protein*p)} g Protein${n.carbs!=null?` · ${Math.round(n.carbs*p)} g KH`:''}`:'Nährwerte für dieses Rezept noch offen';
  document.getElementById('splitPreview').innerHTML=`<div>
    <b>Beim Anrichten</b><br>
    <span class="muted">Du: ${u.toLocaleString('de-DE')} Portionen · ${nutrient(u)}<br>
    Marcel: ${m.toLocaleString('de-DE')} Portionen · ${nutrient(m)}<br>
    ${rest>=0?`Familie/übrig: ${rest.toLocaleString('de-DE')} Portionen`:`⚠ Verplant: ${Math.abs(rest).toLocaleString('de-DE')} Portionen mehr als gekocht`}</span>
  </div>`;
}
function resetPortionSplit(date,index){
  const s=suggestedSplit(weekPlan[date].meals[index]);
  document.getElementById('splitCooked').value=s.cooked;
  document.getElementById('splitUser').value=s.user;
  document.getElementById('splitMarcel').value=s.marcel;
  updateSplitPreview(date,index);
}
async function savePortionSplit(date,index){
  const meal=weekPlan[date]?.meals?.[index]; if(!meal || !householdId)return;
  const title=plainRecipeTitle(meal[1]), mealType=mealTypeForLabel(meal[0]);
  const cooked=Number(document.getElementById('splitCooked')?.value||0);
  const user=Number(document.getElementById('splitUser')?.value||0);
  const marcel=Number(document.getElementById('splitMarcel')?.value||0);
  if(user<0||marcel<0||cooked<0){alert('Bitte nur positive Mengen eintragen.');return;}
  if(user+marcel>cooked+0.0001){
    if(!confirm('Du und Marcel sind zusammen größer als die gekochte Menge. Trotzdem speichern?'))return;
  }
  const payload=[
    {household_id:householdId,meal_date:date,meal_type:mealType,recipe_title:title,person_key:'user',planned_portions:user,updated_at:new Date().toISOString()},
    {household_id:householdId,meal_date:date,meal_type:mealType,recipe_title:title,person_key:'marcel',planned_portions:marcel,updated_at:new Date().toISOString()}
  ];
  const {data,error}=await sb.from('meal_person_portions').upsert(payload,{onConflict:'household_id,meal_date,meal_type,recipe_title,person_key'}).select();
  if(error){alert('Aufteilung konnte nicht gespeichert werden: '+error.message);return;}
  portionRows=portionRows.filter(r=>!(r.meal_date===date && r.meal_type===mealType && r.recipe_title===title));
  portionRows.push(...(data||[]));
  document.getElementById('portionSplitEditor')?.remove();
  renderApp();
}
function nutritionForDay(day){
  const date=dayKeyFor(day);
  const result={
    user:{kcal:0,protein:0,carbs:0,carbsKnown:true},
    husband:{kcal:0,protein:0,carbs:0,carbsKnown:true},
    missing:[]
  };
  (day.meals||[]).forEach(meal=>{
    const title=plainRecipeTitle(meal[1]), n=recipeNutrition[title];
    if(!n){result.missing.push(title);return;}
    const split=splitForMeal(date,meal);
    for(const [person,portions] of [['user',split.user],['husband',split.marcel]]){
      result[person].kcal+=n.kcal*portions;
      result[person].protein+=n.protein*portions;
      if(n.carbs==null)result[person].carbsKnown=false;
      else result[person].carbs+=n.carbs*portions;
    }
  });
  result.missing=[...new Set(result.missing)];
  return result;
}
function nutritionStatus(personKey,x){
  const t=nutritionTargets[personKey];
  const kcalOk=x.kcal>=t.kcalMin && x.kcal<=t.kcalMax;
  const proteinOk=x.protein>=t.proteinMin;
  return {kcalOk,proteinOk,ok:kcalOk&&proteinOk};
}
function nutritionCheckCard(day){
  const n=nutritionForDay(day);
  const u=nutritionStatus('user',n.user), m=nutritionStatus('husband',n.husband);
  const incomplete=n.missing.length>0;
  const line=(key,x,s)=>{
    const t=nutritionTargets[key], label=t.label;
    const kcalTxt=`${Math.round(x.kcal)} / ${t.kcalMin}–${t.kcalMax} kcal`;
    const protTxt=`${Math.round(x.protein)} / ≥${t.proteinMin} g Protein`;
    const carbTxt=key==='husband'?(x.carbsKnown?` · ${Math.round(x.carbs)} g KH`:' · KH teilweise offen'):'';
    return `<div style="margin-top:8px"><b>${label}</b><br><span class="muted">${kcalTxt} ${s.kcalOk?'✓':'⚠'} · ${protTxt} ${s.proteinOk?'✓':'⚠'}${carbTxt}</span></div>`;
  };
  return `<section class="notice" style="margin-top:14px;background:${incomplete?'#fff8e8':(u.ok&&m.ok?'#edf3e9':'#fff8e8')};border-color:${incomplete?'#ead39a':'#d7e2d0'}">
    <div><b>Ernährungscheck ${incomplete?'· teilweise offen':(u.ok&&m.ok?'✓':'· Anpassung nötig')}</b>
      ${line('user',n.user,u)}
      ${line('husband',n.husband,m)}
      ${incomplete?`<div class="meta" style="margin-top:8px">Noch ohne verlässliche Nährwerte: ${n.missing.join(', ')}. Diese Mahlzeiten sind in den Summen noch nicht enthalten.</div>`:''}
      <div class="meta" style="margin-top:8px">Die Werte verwenden jetzt eure Aufteilung je Mahlzeit. Tippe bei einem Gericht auf „So aufteilen“, um sie anzupassen.</div>
    </div>
  </section>`;
}
function nutritionBadge(title){
  const n=recipeNutrition[title];
  if(!n)return '';
  return `${n.source==='ca.'?'ca. ':''}${n.kcal} kcal · ${n.protein} g Protein${n.carbs!=null?` · ${n.carbs} g KH`:''}`;
}

  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});

function confirmCookStart(key){

  if(!Number.isFinite(n)||n<=0){alert('Bitte eine gültige Portionszahl eingeben.');return;}
  cookServings=n; cookMultiplier=c.defaultYield? n/Number(c.defaultYield):1;

async function finishCook(){
  const title=tm6Cook[cookMode].title;
  const {data:recipe}=await sb.from('recipes').select('id,title').eq('household_id',householdId).eq('title',title).maybeSingle();
  if(!recipe){alert('Rezept konnte nicht mit dem Vorrat verknüpft werden.');return;}
  let excluded=[];
  if(title==='Blumenkohlsuppe'){
    const {data:p}=await sb.from('foods').select('id').eq('name','Pastinake').maybeSingle();
    if(p?.id) excluded=[p.id];
  }
  const activeSubs=activeSubstitutionsForRecipe(title);
  if(activeSubs.length) excluded.push(...activeSubs.map(x=>x.required_food_id));
  let y=prompt('Wie viele Teller/Portionen hat die Kochrunde tatsächlich ergeben?',cookServings??tm6Cook[cookMode].defaultYield??'');
  if(y===null)return;
  let p=prompt('Wie viele Portionen bleiben nach dem geplanten Essen übrig? Diese werden als fertige Mahlzeit gespeichert.','');
  if(p===null)return;
  const {data,error}=await sb.rpc('consume_recipe_v2',{
    p_recipe_id:recipe.id,p_cook_token:cookToken,p_multiplier:cookMultiplier,
    p_yield_portions:y.trim()===''?null:Number(y.replace(',','.')),
    p_portions_remaining:p.trim()===''?null:Number(p.replace(',','.')),
    p_excluded_food_ids:excluded
  });
  if(error){alert('Vorrat konnte nicht abgebucht werden: '+error.message);return;}
  if(!data?.duplicate && activeSubs.length){
    for(const sub of activeSubs){
      // Current recipe keeps the non-substituted part of the original ingredient:
      // 3 red peppers in book; 1 is replaced => consume 2 red + 1 green at recipe scale.
      if(title==='Gebackener Feta auf Paprika-Tomaten'){
        const originalUse=2*cookMultiplier, substituteUse=Number(sub.substitute_quantity||1)*cookMultiplier;
        const pools=[
          {food_id:sub.required_food_id,qty:originalUse},
          {food_id:sub.substitute_food_id,qty:substituteUse}
        ];
        for(const pool of pools){
          let remaining=pool.qty;
          const {data:inv}=await sb.from('inventory_items').select('id,quantity,quantity_status').eq('household_id',householdId).eq('food_id',pool.food_id).order('created_at',{ascending:true});
          for(const row of (inv||[])){
            if(remaining<=0)break;
            const have=Number(row.quantity||0), take=Math.min(have,remaining);
            if(take>0){
              await sb.from('inventory_items').update({quantity:Math.max(0,have-take)}).eq('id',row.id);
              remaining-=take;
            }
          }
        }
        await sb.from('meal_ingredient_substitutions').update({status:'used',updated_at:new Date().toISOString()}).eq('id',sub.id);
      }
    }
  }
  if(data?.duplicate){
    alert('Diese Kochrunde wurde bereits verbucht ✓\n\nEs wurde nichts ein zweites Mal vom Vorrat abgezogen.');
    return;
  }
  const est=data?.tracked_estimated||[];
  const untracked=data?.tracked_unquantified||[];
  if(est.length || untracked.length){
    const bits=[];
    if(est.length) bits.push(`${est.length} geschätzte Vorräte wurden als Verbrauch protokolliert`);
    if(untracked.length) bits.push(`${untracked.length} noch nicht angelegte Vorräte wurden als Verbrauch erfasst`);
    alert(`Gekocht ✓\n\n${bits.join('. ')}.\n\nEs wurde keine falsche Restmenge erfunden.`);
  } else {
    alert('Gekocht ✓ Zutaten wurden mengenmäßig aus dem Vorrat abgebucht.');
  }
  const finishedKey=cookMode; cookMode=null;cookToken=null;cookServings=null;cookMultiplier=1;resetCookTimer();releaseCookWakeLock();recipeOpen=finishedKey;activeTab='recipes';renderRecipes();
}


function niceAmount(n){
  if(!Number.isFinite(n)) return '';
  const rounded=Math.round(n*100)/100;
  const whole=Math.floor(rounded);
  const frac=Math.round((rounded-whole)*100)/100;
  const fractions=[
    [0.25,'¼'],[0.33,'⅓'],[0.5,'½'],[0.67,'⅔'],[0.75,'¾']
  ];
  const hit=fractions.find(([v])=>Math.abs(frac-v)<0.02);
  if(hit){
    if(whole===0) return hit[1];
    return `${whole} ${hit[1]}`;
  }
  return rounded.toLocaleString('de-DE',{maximumFractionDigits:2});
}

function scaleNumberToken(raw,factor){
  const n=Number(String(raw).replace(',','.'));
  return Number.isFinite(n)?niceAmount(n*factor):raw;
}

function scaleNeedLine(line,factor){
  if(!factor || Math.abs(factor-1)<0.0001) return line;

  // Mengen mit Küchen-/Gewichtseinheit, egal ob am Anfang oder mitten im Satz.
  let out=line.replace(/(\d+(?:[.,]\d+)?)\s*(kg|g|ml|l|EL|TL)\b/gi,
    (_,num,unit)=>`${scaleNumberToken(num,factor)} ${unit}`);

  // Stückangaben / zählbare Zutaten, die in den Kochschritten vorkommen.
  const countWords='Eier?|Paprika|Tomaten?|Gurken?|Zwiebeln?|Pastinaken?|Blumenkohl|Schalotten?|Radieschen|Knoblauchzehen?|Feta|Schafskäse|Chicorée|Orangen?|Champignons?|Pilze?|Kartoffeln?|Möhren?|Karotten?|Kohlrabi|Auberginen?|Frühlingszwiebeln?';
  // Erlaubt Adjektive zwischen Zahl und Zutat, z. B. „3 rote Paprika“ oder „1 große Zwiebel“.
  const re=new RegExp(`\\b(\\d+(?:[.,]\\d+)?)(\\s+(?:(?!${countWords}\\b)[A-Za-zÄÖÜäöüß-]+\\s+){0,3})(${countWords})\\b`,'gi');
  out=out.replace(re,(_,num,middle,word)=>`${scaleNumberToken(num,factor)}${middle}${word}`);

  return out;
}

function scaleInstructionText(line,factor){
  if(!factor || Math.abs(factor-1)<0.0001) return line;

  // Nur Zutatenmengen skalieren – niemals Zeiten, Temperaturen oder TM6-Stufen.
  let out=line.replace(/(\d+(?:[.,]\d+)?)\s*(kg|g|ml|l|EL|TL)\b/gi,
    (_,num,unit)=>`${scaleNumberToken(num,factor)} ${unit}`);

  const countWords='Eier?|Paprika|Tomaten?|Gurken?|Zwiebeln?|Pastinaken?|Blumenkohl|Schalotten?|Radieschen|Knoblauchzehen?|Feta|Schafskäse|Chicorée|Orangen?|Champignons?|Pilze?|Kartoffeln?|Möhren?|Karotten?|Kohlrabi|Auberginen?|Frühlingszwiebeln?';
  // Erlaubt Adjektive zwischen Zahl und Zutat, z. B. „3 rote Paprika“ oder „1 große Zwiebel“.
  const re=new RegExp(`\\b(\\d+(?:[.,]\\d+)?)(\\s+(?:(?!${countWords}\\b)[A-Za-zÄÖÜäöüß-]+\\s+){0,3})(${countWords})\\b`,'gi');
  out=out.replace(re,(_,num,middle,word)=>`${scaleNumberToken(num,factor)}${middle}${word}`);
  return out;
}



let cookTimerSeconds = 0;
let cookTimerEndAt = null;
let cookTimerRunning = false;
let cookTimerInterval = null;
let cookWakeLock = null;

function formatCookTimer(seconds){
  const s=Math.max(0,Math.ceil(Number(seconds)||0));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return h>0
    ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
    : `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function currentCookTimerSeconds(){
  if(!cookTimerRunning || !cookTimerEndAt) return Math.max(0,cookTimerSeconds);
  return Math.max(0,Math.ceil((cookTimerEndAt-Date.now())/1000));
}
function renderCookTimerOnly(){
  const el=document.getElementById('cookTimerDisplay');
  if(el) el.textContent=formatCookTimer(currentCookTimerSeconds());
  const btn=document.getElementById('cookTimerStartPause');
  if(btn) btn.textContent=cookTimerRunning?'Pause':'Start';
}
async function requestCookWakeLock(){
  try{
    if('wakeLock' in navigator && !cookWakeLock){
      cookWakeLock=await navigator.wakeLock.request('screen');
      cookWakeLock.addEventListener('release',()=>{cookWakeLock=null;});
    }
  }catch(e){}
}
async function releaseCookWakeLock(){
  try{ if(cookWakeLock) await cookWakeLock.release(); }catch(e){}
  cookWakeLock=null;
}
function ensureCookTimerInterval(){
  if(cookTimerInterval) return;
  cookTimerInterval=setInterval(()=>{
    if(cookTimerRunning){
      const left=currentCookTimerSeconds();
      if(left<=0){
        cookTimerRunning=false;
        cookTimerEndAt=null;
        cookTimerSeconds=0;
        renderCookTimerOnly();
        cookTimerAlarm();
      }else{
        renderCookTimerOnly();
      }
    }
  },250);
}
function cookTimerAlarm(){
  try{
    navigator.vibrate?.([250,120,250,120,500]);
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(Ctx){
      const ctx=new Ctx();
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=880; g.gain.value=.08; o.start();
      setTimeout(()=>{try{o.stop();ctx.close();}catch(e){}},900);
    }
  }catch(e){}
  alert('Timer ist fertig ✓');
}
function setCookTimerSeconds(seconds){
  cookTimerRunning=false;
  cookTimerEndAt=null;
  cookTimerSeconds=Math.max(0,Math.round(Number(seconds)||0));
  renderCookTimerOnly();
}
function adjustCookTimer(seconds){
  const left=currentCookTimerSeconds();
  const next=Math.max(0,left+seconds);
  cookTimerSeconds=next;
  if(cookTimerRunning) cookTimerEndAt=Date.now()+next*1000;
  renderCookTimerOnly();
}
function toggleCookTimer(){
  const left=currentCookTimerSeconds();
  if(cookTimerRunning){
    cookTimerSeconds=left;
    cookTimerRunning=false;
    cookTimerEndAt=null;
  }else if(left>0){
    cookTimerSeconds=left;
    cookTimerEndAt=Date.now()+left*1000;
    cookTimerRunning=true;
    requestCookWakeLock();
    ensureCookTimerInterval();
  }
  renderCookTimerOnly();
}
function resetCookTimer(){
  cookTimerRunning=false;
  cookTimerEndAt=null;
  cookTimerSeconds=0;
  renderCookTimerOnly();
}
function secondsFromStepSetting(setting){
  if(!setting) return null;
  let total=0, found=false;
  const h=setting.match(/(\d+(?:[.,]\d+)?)\s*Std/i);
  const m=setting.match(/(\d+(?:[.,]\d+)?)\s*Min/i);
  const s=setting.match(/(\d+(?:[.,]\d+)?)\s*Sek/i);
  if(h){total+=Number(h[1].replace(',','.'))*3600;found=true;}
  if(m){total+=Number(m[1].replace(',','.'))*60;found=true;}
  if(s){total+=Number(s[1].replace(',','.'));found=true;}
  return found?Math.round(total):null;
}
function useStepTime(){
  if(!cookMode) return;
  const s=tm6Cook[cookMode]?.steps?.[cookStep];
  const secs=secondsFromStepSetting(s?.setting);
  if(secs) setCookTimerSeconds(secs);
}

function substitutionSuggestionForShopping(r){
  if(r.checked || r.category==='Vorrat prüfen' || Number(r.quantity_to_buy||0)<=0) return null;
  const pref=substitutionPrefs.find(p=>p.required_food_id===r.food_id && p.requires_confirmation);
  if(!pref)return null;
  const needed=Number(r.quantity_to_buy||0)*Number(pref.ratio||1);
  const candidates=inventoryRows.filter(x=>x.food_id===pref.substitute_food_id && unitSimple(x.unit)===unitSimple(r.required_unit) && Number(x.quantity||0)>0);
  const available=candidates.reduce((s,x)=>s+Number(x.quantity||0),0);
  if(available+1e-9<needed)return null;
  const foodName=pref.substitute_food?.name||'Alternative aus dem Vorrat';
  const already=mealSubstitutions.find(x=>x.required_food_id===r.food_id && x.substitute_food_id===pref.substitute_food_id && x.meal_date===r.needed_by && x.status==='planned');
  return {pref,needed,available,foodName,already};
}
async function acceptShoppingSubstitution(shoppingId){
  const r=rows.find(x=>x.id===shoppingId); if(!r)return;
  const s=substitutionSuggestionForShopping(r); if(!s)return;
  const recipeTitle=(r.foods?.name==='Rote Paprika' && r.needed_by==='2026-09-01')?'Gebackener Feta auf Paprika-Tomaten':'Geplante Mahlzeit';
  const payload={
    household_id:householdId,meal_date:r.needed_by,recipe_title:recipeTitle,
    required_food_id:r.food_id,substitute_food_id:s.pref.substitute_food_id,
    required_quantity:Number(r.quantity_to_buy),substitute_quantity:s.needed,
    unit:r.required_unit,status:'planned',
    note:'Vom Nutzer als Vorratsalternative bestätigt; Originalrezept bleibt unverändert.',
    updated_at:new Date().toISOString()
  };
  const {data,error}=await sb.from('meal_ingredient_substitutions').upsert(payload,{onConflict:'household_id,meal_date,recipe_title,required_food_id,substitute_food_id'}).select();
  if(error){alert('Alternative konnte nicht gespeichert werden: '+error.message);return;}
  mealSubstitutions=mealSubstitutions.filter(x=>!(x.required_food_id===r.food_id&&x.substitute_food_id===s.pref.substitute_food_id&&x.meal_date===r.needed_by));
  mealSubstitutions.push(...(data||[]));
  // Der heutige Einkaufsposten ist durch die bestätigte Alternative abgedeckt.
  const {error:e2}=await sb.from('shopping_items').update({checked:true}).eq('id',r.id);
  if(e2){alert('Alternative gespeichert, Einkaufsposten konnte aber nicht ausgeblendet werden: '+e2.message);return;}
  r.checked=true;
  msg=`Alternative bestätigt: ${s.needed.toLocaleString('de-DE')} ${r.required_unit} ${s.foodName} statt fehlender ${r.foods?.name||'Zutat'}.`;
  renderShopping();
}

    <div><b>Wichtig</b><br><span class="muted">Automatisch gerechnet wird nur für Rezepte, deren Zutaten vollständig in der Rezeptdatenbank erfasst sind. Noch unvollständige Kochbuchrezepte bleiben als manuelle Einkaufsposten erhalten.</span></div>
  </section>
  <section class="list">${vis.map(r=>`<article class="item ${r.checked?'done':''}"><button class="check" onclick="toggle('${r.id}')">${r.checked?'✓':''}</button><div class="body"><div class="top"><h2>${esc(r.foods?.name||'Unbekannter Artikel')}</h2><span class="pill ${r.category==='Vorrat prüfen'?'warn':''}">${esc(r.category==='Vorrat prüfen'?'prüfen':formatBuy(r))}</span></div><p class="desc">${esc(reason(r))}</p>${r.needed_by?`<div class="meta">benötigt ${new Date(r.needed_by+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})}${r.auto_generated?' · automatisch aus dem Plan':r.manually_added?' · manuell geschützt':''}</div>`:''}${(()=>{const s=substitutionSuggestionForShopping(r);return s&&!s.already?`<div class="notice" style="margin-top:10px;background:#edf3e9;border-color:#d7e2d0"><div><b>Alternative im Vorrat gefunden</b><br><span class="muted">${s.needed.toLocaleString('de-DE')} ${esc(r.required_unit)} ${esc(s.foodName)} können die Fehlmenge ersetzen. Originalrezept bleibt dokumentiert.</span><br><button onclick="acceptShoppingSubstitution('${r.id}')" style="margin-top:9px;padding:9px 12px;border:0;border-radius:13px;background:#294936;color:white;font-weight:700">Alternative verwenden</button></div></div>`:s?.already?`<div class="meta" style="margin-top:8px">✓ Alternative bestätigt: ${esc(s.foodName)}</div>`:''})()}${!r.checked&&r.category!=='Vorrat prüfen'?`<button onclick="openRealPurchase('${r.id}')" style="margin-top:10px;padding:10px 14px;border:0;border-radius:14px;background:#294936;color:white;font-weight:700">Gekauft · echte Packung eingeben</button>`:''}${r.checked?`<button onclick="putAway('${r.id}')" style="margin-top:10px;padding:10px 14px;border:0;border-radius:14px;background:#294936;color:white;font-weight:700">Eingeräumt</button>`:''}</div></article>`).join('')}</section>
  <nav class="bottom"><span onclick="activeTab='today';renderApp()">Heute</span><span onclick="activeTab='plan';renderApp()">Plan</span><span onclick="activeTab='recipes';recipeOpen=null;renderApp()">Rezepte</span><span onclick="activeTab='inventory';loadInventory()">Vorrat</span><b onclick="activeTab='shopping';renderApp()">Einkauf</b></nav></main>`;
}

function renderApp(){
  if(activeTab==='shopping') renderShopping();
  else if(activeTab==='plan') renderPlan();
  else if(activeTab==='recipes') renderRecipes();
  else if(activeTab==='inventory') renderInventory();
  else renderToday();
}
async function login(){
  const email=document.getElementById('email').value, password=document.getElementById('password').value;
  const {error}=await sb.auth.signInWithPassword({email,password});
  const el=document.getElementById('loginmsg'); if(error){el.textContent=error.message;el.classList.remove('hidden')}
}
async function signup(){
  const email=document.getElementById('email').value, password=document.getElementById('password').value;
  const {error}=await sb.auth.signUp({email,password});
  const el=document.getElementById('loginmsg'); el.textContent=error?error.message:'Konto angelegt. Falls eine Bestätigungsmail kommt, bitte den Link darin öffnen.';el.classList.remove('hidden');
}
async function logout(){await sb.auth.signOut();}
async function copyUid(){await navigator.clipboard.writeText(userId);alert('User-ID kopiert');}

async function refreshSmartShopping(showError=true){
  if(!householdId)return null;
  const {data,error}=await sb.rpc('refresh_smart_shopping',{p_household_id:householdId});
  if(error){
    if(showError) msg='Smart-Abgleich konnte nicht aktualisiert werden: '+error.message;
    return null;
  }
  smartSummary=data||null;
  return data;
}

function reservationForInventory(r){
  const u=unitSimple(r.unit);
  return reservationRows
    .filter(x=>x.food_id===r.food_id && unitSimple(x.unit)===u)
    .reduce((sum,x)=>sum+Number(x.reserved_inventory||0),0);
}
function totalKnownForPool(r){
  const u=unitSimple(r.unit);
  return inventoryRows
    .filter(x=>x.food_id===r.food_id && x.quantity_status==='known' && unitSimple(x.unit)===u)
    .reduce((sum,x)=>sum+Number(x.quantity||0),0);
}
function firstPoolRow(r){
  const u=unitSimple(r.unit);
  return inventoryRows.find(x=>x.food_id===r.food_id && unitSimple(x.unit)===u)?.id===r.id;
}
function smartInventoryMeta(r){
  if(r.quantity_status!=='known' || r.quantity==null || !firstPoolRow(r)) return '';
  const reserved=reservationForInventory(r);
  if(reserved<=0)return '';
  const total=totalKnownForPool(r);
  const free=Math.max(0,total-reserved);
  return `<div class="meta" style="margin-top:5px"><b>Plan:</b> ${reserved.toLocaleString('de-DE')} ${esc(r.unit||'')} reserviert · ${free.toLocaleString('de-DE')} ${esc(r.unit||'')} frei</div>`;
}

async function toggle(id){
  const r=rows.find(x=>x.id===id); if(!r)return; const next=!r.checked; r.checked=next; renderApp();
  const {error}=await sb.from('shopping_items').update({checked:next}).eq('id',id);
  if(error){r.checked=!next;msg='Abhaken konnte nicht gespeichert werden: '+error.message;renderApp();return;}
  await refreshSmartShopping(false);
  await loadRows(false);
}

async function loadPreparedMeals(){
  if(!householdId){preparedMealRows=[];return;}
  const {data,error}=await sb.from('prepared_meals').select('id,recipe_id,name,portions,location,cooked_at,status').eq('household_id',householdId).gt('portions',0).order('cooked_at',{ascending:false});
  preparedMealRows=error?[]:(data||[]);
}

async function loadInventory(){
  if(!householdId){activeTab='inventory';renderApp();return;}
  await refreshSmartShopping(false);
  await loadPreparedMeals();
  const [{data:inv,error},{data:foodsData,error:foodsError},{data:res,error:resError}] = await Promise.all([
    sb.from('inventory_items')
      .select('id,food_id,quantity,unit,location,quantity_status,opened,foods(name)')
      .eq('household_id',householdId).order('location',{ascending:true}),
    sb.from('foods').select('id,name,default_unit').order('name',{ascending:true}),
    sb.from('inventory_reservations')
      .select('id,food_id,needed_by,required_quantity,unit,reserved_inventory,reserved_delivery,reserved_purchased,shortage')
      .eq('household_id',householdId).order('needed_by',{ascending:true})
  ]);
  inventoryRows=error?[]:(inv||[]);
  foodOptions=foodsError?[]:(foodsData||[]);
  reservationRows=resError?[]:(res||[]);
  if(error) msg='Vorrat konnte nicht geladen werden: '+error.message;
  if(resError) msg='Reservierungen konnten nicht geladen werden: '+resError.message;
  activeTab='inventory'; renderApp();
}

function openInventoryEditor(id=null){
  inventoryEditId=id;
  const r=id?inventoryRows.find(x=>x.id===id):null;
  const name=r?.foods?.name||'';
  const qty=r?.quantity??'';
  const unit=r?.unit||'';
  const loc=r?.location||'Kühlschrank';
  const status=r?.quantity_status||'known';
  const opened=!!r?.opened;

  const overlay=document.createElement('div');
  overlay.id='inventoryEditor';
  overlay.style='position:fixed;inset:0;background:rgba(20,30,24,.42);z-index:9999;display:flex;align-items:flex-end;justify-content:center;padding:12px';
  overlay.innerHTML=`<section style="width:min(620px,100%);max-height:90vh;overflow:auto;background:#fffdf7;border-radius:26px 26px 18px 18px;padding:20px;box-shadow:0 -10px 40px rgba(0,0,0,.18)">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
      <div><div class="eyebrow">${id?'BESTAND BEARBEITEN':'NEUER VORRAT'}</div><h2 style="margin:4px 0 0">${id?esc(name):'Vorrat hinzufügen'}</h2></div>
      <button class="icon" onclick="closeInventoryEditor()">×</button>
    </div>

    ${id?`<input id="invFoodId" type="hidden" value="${r.food_id}">`:
      `<label style="display:block;margin-top:18px">Lebensmittel
        <input id="invFoodName" list="foodList" placeholder="z. B. Joghurt 1,5 %" autocomplete="off" style="width:100%">
        <datalist id="foodList">${foodOptions.map(f=>`<option value="${esc(f.name)}"></option>`).join('')}</datalist>
      </label>`}

    <div style="display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin-top:14px">
      <label>Menge
        <input id="invQty" inputmode="decimal" type="number" step="0.01" min="0" value="${esc(String(qty))}" placeholder="z. B. 8" style="width:100%">
      </label>
      <label>Einheit
        <input id="invUnit" value="${esc(unit)}" placeholder="g, ml, Stück …" style="width:100%">
      </label>
    </div>

    <label style="display:block;margin-top:14px">Lagerort
      <input id="invLoc" value="${esc(loc)}" placeholder="Kühlschrank, Vorratsschrank …" style="width:100%">
    </label>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
      <label>Status
        <select id="invStatus" style="width:100%;padding:12px;border-radius:12px;border:1px solid #d8d2c3;background:white">
          <option value="known" ${status==='known'?'selected':''}>genau</option>
          <option value="estimated" ${status==='estimated'?'selected':''}>geschätzt</option>
          <option value="low" ${status==='low'?'selected':''}>wenig</option>
          <option value="unknown" ${status==='unknown'?'selected':''}>unklar</option>
        </select>
      </label>
      <label style="display:flex;align-items:center;gap:10px;padding-top:27px">
        <input id="invOpened" type="checkbox" ${opened?'checked':''}> geöffnet
      </label>
    </div>

    <div class="notice" style="margin-top:14px;background:#edf3e9;border-color:#d7e2d0">
      <div><b>Manuelle Eingabe hat Vorrang</b><br><span class="muted">Wenn du „genau“ auswählst, gilt diese Menge als echter Bestand und ersetzt die bisherige Schätzung.</span></div>
    </div>

    <div style="display:flex;gap:10px;margin-top:16px">
      ${id?`<button class="secondary" style="flex:1" onclick="markInventoryEmpty('${id}')">Aufgebraucht</button>`:''}
      <button class="primary" style="flex:2" onclick="saveInventoryEditor()">Speichern</button>
    </div>
  </section>`;
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeInventoryEditor()});
  document.body.appendChild(overlay);
}

function closeInventoryEditor(){
  document.getElementById('inventoryEditor')?.remove();
}

async function saveInventoryEditor(){
  const qtyRaw=document.getElementById('invQty').value;
  const qty=qtyRaw===''?null:Number(qtyRaw);
  const unit=document.getElementById('invUnit').value.trim();
  const location=document.getElementById('invLoc').value.trim()||'Ohne Ort';
  const quantity_status=document.getElementById('invStatus').value;
  const opened=document.getElementById('invOpened').checked;

  if(qty!==null && (Number.isNaN(qty)||qty<0)){alert('Bitte eine gültige Menge eingeben.');return;}

  let foodId;
  if(inventoryEditId){
    foodId=document.getElementById('invFoodId').value;
  }else{
    const name=document.getElementById('invFoodName').value.trim();
    if(!name){alert('Bitte ein Lebensmittel auswählen oder eingeben.');return;}
    let food=foodOptions.find(f=>f.name.toLowerCase()===name.toLowerCase());
    if(!food){
      const {data,error}=await sb.from('foods').insert({name,default_unit:unit||null}).select('id,name,default_unit').single();
      if(error){alert('Lebensmittel konnte nicht angelegt werden: '+error.message);return;}
      food=data;
      foodOptions.push(food);
    }
    foodId=food.id;
  }

  let error;
  if(inventoryEditId){
    ({error}=await sb.from('inventory_items').update({
      quantity:qty,unit:unit||null,location,quantity_status,opened,last_checked_at:new Date().toISOString()
    }).eq('id',inventoryEditId).eq('household_id',householdId));
  }else{
    const existing=inventoryRows.find(r=>r.food_id===foodId && (r.location||'')===location);
    if(existing){
      ({error}=await sb.from('inventory_items').update({
        quantity:qty,unit:unit||null,quantity_status,opened,last_checked_at:new Date().toISOString()
      }).eq('id',existing.id).eq('household_id',householdId));
    }else{
      ({error}=await sb.from('inventory_items').insert({
        household_id:householdId,food_id:foodId,quantity:qty,unit:unit||null,location,quantity_status,opened,last_checked_at:new Date().toISOString()
      }));
    }
  }
  if(error){alert('Bestand konnte nicht gespeichert werden: '+error.message);return;}

  await refreshSmartShopping(false);
  closeInventoryEditor();
  inventoryEditId=null;
  await loadInventory();
}

async function markInventoryEmpty(id){
  const r=inventoryRows.find(x=>x.id===id);
  if(!r)return;
  const {error}=await sb.from('inventory_items').update({
    quantity:0,quantity_status:'known',last_checked_at:new Date().toISOString()
  }).eq('id',id).eq('household_id',householdId);
  if(error){alert('Konnte nicht als aufgebraucht speichern: '+error.message);return;}
  await refreshSmartShopping(false);
  closeInventoryEditor();
  inventoryEditId=null;
  await loadInventory();
}

function unitSimple(u){
  return (u||'').toLowerCase().trim()
    .replace('stück','st').replace('stck','st').replace('stk','st')
    .replace('gramm','g').replace('kilogramm','kg')
    .replace('milliliter','ml').replace('liter','l');
}

async function recalcShoppingForFood(foodId,qty,unit,status){
  if(status!=='known' || qty===null) return;
  const {data:items,error}=await sb.from('shopping_items')
    .select('id,required_quantity,required_unit,covered_by_delivery,package_size,packages_to_buy,checked')
    .eq('household_id',householdId).eq('food_id',foodId);
  if(error || !items?.length) return;

  for(const item of items){
    if(unitSimple(item.required_unit)!==unitSimple(unit)) continue;
    const required=Number(item.required_quantity||0);
    const delivery=Number(item.covered_by_delivery||0);
    const covered=Math.min(Number(qty||0),required);
    const toBuy=Math.max(0,required-covered-delivery);
    const pack=Number(item.package_size||0);
    const packages=pack>0?Math.ceil(toBuy/pack):(toBuy>0?1:0);
    await sb.from('shopping_items').update({
      covered_by_inventory:covered,
      quantity_to_buy:toBuy,
      packages_to_buy:packages,
      checked:toBuy===0 ? true : item.checked
    }).eq('id',item.id);
  }
}

async function putAway(id){
  const {data,error}=await sb.rpc('put_away_shopping_item',{p_shopping_item_id:id});
  if(error){alert('Einräumen nicht möglich: '+error.message);return;}
  await refreshSmartShopping(false);
  alert(`Eingeräumt: ${data.quantity_added} ${data.unit} · Einkaufsliste neu berechnet`);
  await loadRows(false);
}

async function loadRows(doRefresh=true){
  msg='';
  rows=[];
  householdId='';

  const {data:member,error:memberError}=await sb
    .from('household_members')
    .select('household_id')
    .eq('user_id',userId)
    .limit(1)
    .maybeSingle();

  if(memberError){
    msg='Haushaltszuordnung konnte nicht geprüft werden: '+memberError.message;
    renderApp();
    return;
  }

  if(!member?.household_id){
    msg='Du bist angemeldet, aber diesem Supabase-Nutzer ist noch kein Haushalt zugeordnet.';
    renderApp();
    return;
  }

  householdId=member.household_id;
  if(doRefresh) await refreshSmartShopping(false);

  const {data:portionData,error:portionError}=await sb.from('meal_person_portions')
    .select('id,meal_date,meal_type,recipe_title,person_key,planned_portions')
    .eq('household_id',householdId)
    .order('meal_date',{ascending:true});
  portionRows=portionError?[]:(portionData||[]);
  if(portionError) msg='Portionsaufteilung konnte nicht geladen werden: '+portionError.message;

  const [{data:prefData},{data:subData},{data:invData}]=await Promise.all([
    sb.from('ingredient_substitution_preferences').select('id,required_food_id,substitute_food_id,ratio,requires_confirmation,note,substitute_food:foods!ingredient_substitution_preferences_substitute_food_id_fkey(name)').eq('household_id',householdId),
    sb.from('meal_ingredient_substitutions').select('id,meal_date,recipe_title,required_food_id,substitute_food_id,required_quantity,substitute_quantity,unit,status,note,required_food:foods!meal_ingredient_substitutions_required_food_id_fkey(name),substitute_food:foods!meal_ingredient_substitutions_substitute_food_id_fkey(name)').eq('household_id',householdId),
    sb.from('inventory_items').select('id,food_id,quantity,unit,quantity_status,foods(name)').eq('household_id',householdId)
  ]);
  substitutionPrefs=prefData||[];
  mealSubstitutions=subData||[];
  if(invData) inventoryRows=invData;

  const {data,error}=await sb
    .from('shopping_items')
    .select('id,household_id,food_id,required_quantity,required_unit,covered_by_inventory,covered_by_delivery,covered_by_purchased,quantity_to_buy,package_size,package_unit,packages_to_buy,category,checked,manually_added,auto_generated,needed_by,foods(name)')
    .eq('household_id',householdId)
    .order('needed_by',{ascending:true});

  if(error){
    msg='Einkaufsliste konnte nicht geladen werden: '+error.message;
    rows=[];
  } else {
    rows=data||[];
    if(!rows.length) msg='Haushalt erkannt – aktuell sind keine Einkaufsposten vorhanden.';
  }
  renderApp();
}
sb.auth.getSession().then(async ({data})=>{if(data.session){userId=data.session.user.id;await loadRows()}else renderLogin()});
sb.auth.onAuthStateChange((_e,session)=>{if(session){userId=session.user.id;setTimeout(loadRows,0)}else{rows=[];householdId='';userId='';renderLogin()}});
</script>
